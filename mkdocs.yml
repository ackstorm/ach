site_name: ACH — Agent Capability Hub
site_description: Kubernetes control plane for managing AI agent configurations declaratively
site_url: https://ackstorm.github.io/ach/
repo_url: https://github.com/ackstorm/ach
repo_name: ackstorm/ach

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/first-environment.md
      - tutorials/install-ach.md
  - How-to:
      - Developers:
          - how-to/developers/install-ach-cli.md
          - how-to/developers/sign-in.md
          - how-to/developers/use-environments.md
          - how-to/developers/launch-a-tool.md
          - how-to/developers/sign-in-to-an-mcp-server.md
          - how-to/developers/sign-in-from-tools.md
          - how-to/developers/manage-keys.md
          - how-to/developers/install-from-git.md
          - how-to/developers/install-agent-plugins.md
          - how-to/developers/troubleshoot.md
      - Admins:
          - how-to/admins/enable-enterprise.md
          - how-to/admins/rotate-jwt-signing-keys.md
      - Backend builders:
          - how-to/backend-builders/write-an-mcp-backend.md
          - how-to/backend-builders/exchange-a-serviceaccount-token.md
  - Reference:
      - reference/cli.md
      - reference/helm-values.md
      - CRD API: api-reference/ach.ackstorm.ai.md
      - reference/jwt.md
      - reference/changelog.md
  - Explanation:
      - explanation/concepts.md
      - explanation/architecture.md
      - explanation/keys-and-budgets.md
      - explanation/trust-path.md
      - explanation/editions.md

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ackstorm/ach

exclude_docs: |
  superpowers/
  plans/
  Makefile
  requirements.txt

validation:
  nav:
    omitted_files: warn
