site_name: ACH — Agent Capability Hub
site_description: Kubernetes control plane for managing AI agent configurations declaratively
site_url: https://ackstorm.github.io/ach/
repo_url: https://github.com/ackstorm/ach
repo_name: ackstorm/ach

nav:
  - Overview:
      - What ACH is: index.md
      - overview/concepts.md
      - overview/architecture.md
      - overview/editions.md
  - ACH Platform:
      - Get started:
          - platform/install-ach.md
      - Install and operate:
          - platform/enable-enterprise.md
          - platform/rotate-jwt-signing-keys.md
  - Using ACH:
      - Get started:
          - using/first-environment.md
      - Guides:
          - using/sign-in.md
          - using/use-environments.md
          - using/launch-a-tool.md
          - using/sign-in-to-an-mcp-server.md
          - using/sign-in-from-tools.md
          - using/manage-keys.md
          - Keys and budgets: using/keys-and-budgets.md
          - using/install-agent-plugins.md
          - using/install-from-git.md
      - ach-cli:
          - using/install-ach-cli.md
          - using/troubleshoot.md
  - Integrate:
      - integrate/write-an-mcp-backend.md
      - integrate/exchange-a-serviceaccount-token.md
      - integrate/trust-path.md
  - Reference:
      - reference/cli.md
      - reference/helm-values.md
      - CRD API: api-reference/ach.ackstorm.ai.md
      - reference/jwt.md
      - reference/changelog.md

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ackstorm/ach

exclude_docs: |
  superpowers/
  plans/
  Makefile
  requirements.txt

validation:
  nav:
    omitted_files: warn
