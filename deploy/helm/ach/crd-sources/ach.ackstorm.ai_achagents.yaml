---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.17.0
  name: achagents.ach.ackstorm.ai
spec:
  group: ach.ackstorm.ai
  names:
    kind: ACHAgent
    listKind: ACHAgentList
    plural: achagents
    shortNames:
    - agent
    singular: achagent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.gatewayURL
      name: Gateway
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ACHAgent is a running agent instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ACHAgentSpec defines the desired state of an agent instance.
            properties:
              capability:
                description: 'CapabilitySpec is the per-agent capability block (config:
                  capability{type:ach,ach.environment,filter}).'
                properties:
                  environment:
                    description: |-
                      Environment is the ACH Hub Environment name, for documentation/intent only.
                      The ek already scopes the environment server-side, and the harness reads the
                      hydrated environment (manifest.environment) — NOT this field. Optional: omit
                      to let the ek decide; when set it is rendered but never authoritative.
                    type: string
                  filter:
                    description: FilterSpec wraps the exclude gate.
                    properties:
                      exclude:
                        description: 'ExcludeSpec is the governance gate ABOVE the
                          model (config: capability.filter.exclude).'
                        properties:
                          mcpServers:
                            items:
                              type: string
                            type: array
                          skills:
                            items:
                              type: string
                            type: array
                          tools:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                type: object
              channels:
                items:
                  description: 'ChannelSpec is one inbound channel (config: channels[]).'
                  properties:
                    a2a:
                      description: 'A2ASpec configures an a2a channel (config: channels[].a2a;
                        mode async-only in v1).'
                      properties:
                        auth:
                          description: 'A2AAuthSpec configures a2a inbound auth (config:
                            channels[].a2a.auth; secretRef → secretPath).'
                          properties:
                            header:
                              default: x-a2a-custom-api-key
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretRef
                          type: object
                      required:
                      - auth
                      type: object
                    concurrency:
                      default: 1
                      format: int64
                      minimum: 1
                      type: integer
                    cron:
                      description: 'CronSpec configures a cron channel (config: channels[].cron).'
                      properties:
                        schedule:
                          type: string
                        timezone:
                          default: UTC
                          type: string
                      required:
                      - schedule
                      type: object
                    name:
                      minLength: 1
                      type: string
                    prompt:
                      type: string
                    queue:
                      description: 'QueueSpec configures a redis queue channel (config:
                        channels[].queue; type/ackMode are constants).'
                      properties:
                        key:
                          type: string
                      required:
                      - key
                      type: object
                    session:
                      description: |-
                        SessionSpec selects which opencode conversation a channel turn reuses and
                        bounds its growth (config: channels[].session). type is the discriminator;
                        key is the {{ }} template, valid ONLY when type==custom. Omitting the whole
                        block lets the harness apply its own default (type: none). This changes only
                        which session a turn reuses — the router lane key (event.session_key) is
                        unaffected.
                      properties:
                        key:
                          description: |-
                            Key is the {{ }} session template (payload.* / internal.*). REQUIRED iff
                            type==custom, FORBIDDEN otherwise. An empty render falls back to none + WARN.
                          type: string
                        maxTokens:
                          description: |-
                            MaxTokens caps growth: once the previous turn's input_tokens exceed it,
                            apply overflow (auto/custom only; ignored for none).
                          format: int64
                          minimum: 1
                          type: integer
                        overflow:
                          default: compact
                          description: |-
                            Overflow: compact summarizes the session in place; rotate starts a fresh
                            session and deletes the old one.
                          enum:
                          - compact
                          - rotate
                          type: string
                        type:
                          default: none
                          description: |-
                            none: fresh session per event, deleted post-turn. auto: reuse the
                            channel-derived session_key. custom: reuse the session named by key.
                          enum:
                          - auto
                          - none
                          - custom
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: session.key is required (non-empty) iff type is custom,
                          forbidden otherwise
                        rule: 'self.type != ''custom'' ? !has(self.key) : (has(self.key)
                          && size(self.key) > 0)'
                    source:
                      enum:
                      - gitlab
                      - github
                      - generic
                      type: string
                    type:
                      enum:
                      - webhook
                      - cron
                      - queue
                      - a2a
                      type: string
                    webhook:
                      description: 'WebhookSpec configures a webhook channel (config:
                        channels[].webhook + channels[].source).'
                      properties:
                        auth:
                          description: 'WebhookAuthSpec configures webhook auth (config:
                            channels[].webhook.auth; secretRef → secretPath).'
                          properties:
                            header:
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            type:
                              enum:
                              - gitlab_token
                              - hmac
                              - header_token
                              - none
                              type: string
                          required:
                          - type
                          type: object
                          x-kubernetes-validations:
                          - message: webhook.auth.secretRef is required unless type=none
                            rule: self.type=='none' || has(self.secretRef)
                          - message: webhook.auth.header is required when type=header_token
                            rule: self.type!='header_token' || (has(self.header) &&
                              size(self.header)>0)
                        gitlabEvents:
                          items:
                            enum:
                            - merge_request
                            - issue
                            - note
                            type: string
                          type: array
                      required:
                      - auth
                      type: object
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: 'channels: the block matching type is required'
                    rule: (self.type=='webhook' && has(self.webhook)) || (self.type=='cron'
                      && has(self.cron)) || (self.type=='queue' && has(self.queue))
                      || (self.type=='a2a' && has(self.a2a))
                  - message: channels.source is only valid for webhook channels
                    rule: self.type=='webhook' || !has(self.source)
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              expose:
                description: |-
                  Expose controls reachability (Service + gateway route). Omit for a fully
                  private agent (no Service, no public URL).
                properties:
                  gateway:
                    description: |-
                      Gateway publishes the agent on the shared ACH gateway
                      (/agents/{ns}/{service} route + status.gatewayURL). Requires service.
                    type: boolean
                  service:
                    description: |-
                      Service creates the ClusterIP Service (achagent-<name>) so in-cluster
                      peers (a2a) or your own ingress can reach the harness. Required for any
                      inbound HTTP channel (webhook/a2a) to be reachable at all.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: expose.gateway requires expose.service
                  rule: '!self.gateway || self.service'
              identity:
                description: 'IdentitySpec carries the ACH ek_ (config: injected as
                  ACH_TOKEN env via secretKeyRef).'
                properties:
                  secretRef:
                    description: SecretRef points at a Secret holding the ek_ (create
                      it yourself, e.g. `ach-cli keys create`).
                    properties:
                      key:
                        description: Key is the data key inside the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Kubernetes Secret name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretRef
                type: object
              limits:
                description: Limits overrides the profile's default limits.
                properties:
                  idempotencyWindowSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxConcurrentInvocations:
                    format: int64
                    minimum: 1
                    type: integer
                  maxInvocationSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxQueuedTotal:
                    format: int64
                    minimum: 1
                    type: integer
                  maxSteps:
                    format: int64
                    minimum: 1
                    type: integer
                  terminalOutputRetries:
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              memory:
                description: |-
                  MemorySpec is a discriminated memory backend (config: memory). Omit for no memory (fail-open).
                  Asymmetry is intentional and mirrors the schema: HindsightMemory REQUIRES the hindsight block
                  (endpoint has no default); CodememMemory requires only `type` — {"type":"codemem"} is valid
                  (dbPath/project are derived/defaulted by the harness).
                properties:
                  codemem:
                    description: 'CodememSpec is the codemem memory backend (config:
                      memory.codemem). All fields optional.'
                    properties:
                      dbPath:
                        type: string
                      project:
                        type: string
                    type: object
                  hindsight:
                    description: 'HindsightSpec is the hindsight memory backend (config:
                      memory.hindsight).'
                    properties:
                      bank:
                        type: string
                      endpoint:
                        minLength: 1
                        type: string
                      mentalModels:
                        items:
                          type: string
                        type: array
                    required:
                    - endpoint
                    type: object
                  type:
                    enum:
                    - hindsight
                    - codemem
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: memory.hindsight is required when type=hindsight
                  rule: (self.type=='hindsight' && has(self.hindsight)) || (self.type=='codemem')
              model:
                description: Model overrides the profile's default model.
                properties:
                  name:
                    minLength: 1
                    type: string
                  params:
                    description: Params is an open, unvalidated dict splatted to the
                      model client.
                    x-kubernetes-preserve-unknown-fields: true
                  type:
                    enum:
                    - openai
                    - gemini
                    - anthropic
                    type: string
                required:
                - name
                - type
                type: object
              profileRef:
                description: LocalObjectRef references a resource by name in the CR's
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              prompt:
                description: 'AgentPromptSpec configures the system prompt (config:
                  prompt).'
                properties:
                  compose:
                    default: append
                    enum:
                    - replace
                    - append
                    type: string
                  system:
                    description: |-
                      PromptSystemSpec is a discriminated persona source (config: prompt.system).
                      The ach form MAY carry an optional achFile (rendered as system.file — the schema's SystemAch
                      allows `file` as an optional subpath within the named prompt).
                    properties:
                      ach:
                        type: string
                      achFile:
                        description: AchFile is an optional subpath within an `ach`
                          prompt (rendered as prompt.system.file).
                        type: string
                      file:
                        type: string
                      text:
                        type: string
                      type:
                        enum:
                        - text
                        - file
                        - ach
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: 'prompt.system: the block matching type is required'
                      rule: (self.type=='text' && has(self.text)) || (self.type=='file'
                        && has(self.file)) || (self.type=='ach' && has(self.ach))
                required:
                - system
                type: object
            required:
            - capability
            - channels
            - identity
            - profileRef
            type: object
          status:
            description: ACHAgentStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gatewayURL:
                description: |-
                  GatewayURL is the inbound base URL for this agent on the shared gateway,
                  e.g. https://ach.example.com/agents/ach-system/achagent-gh. The last
                  segment is the agent's Service name; the gateway forwards anything
                  after it verbatim to that Service (append the harness route you need,
                  e.g. /channels/{name}/events for a webhook channel, or the a2a path).
                  Set only when the agent opts into gateway exposure (expose.gateway).
                  The host segment is only populated when the operator has
                  ACH_PUBLIC_BASE_URL (or, as a fallback, ACH_BASE_URL) configured;
                  otherwise this is the path-only form for the caller to prefix with
                  their own ingress host.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: ACHAgent name must be <= 50 chars (operator derives <=63-char child
            names)
          rule: size(self.metadata.name) <= 50
    served: true
    storage: true
    subresources:
      status: {}
