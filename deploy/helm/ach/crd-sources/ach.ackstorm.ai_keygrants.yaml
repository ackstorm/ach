---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.17.0
  name: keygrants.ach.ackstorm.ai
spec:
  group: ach.ackstorm.ai
  names:
    kind: KeyGrant
    listKind: KeyGrantList
    plural: keygrants
    shortNames:
    - kg
    singular: keygrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.identity
      name: Identity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeyGrant lets the named ServiceAccounts exchange their pod token for an ACH
          credential of Identity in the named Environments. A grant naming a shared
          ServiceAccount is usable by every pod running that ServiceAccount. Writing
          one is the power to act as Identity: the chart's <release>-keygrant-editor ClusterRole
          (ach-keygrant-editor for release ach) is bound to nobody and is never aggregated into admin or edit.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KeyGrantSpec allows POST /platform/keys/exchange for one identity in every
              combination of its Environments and Requesters — and nothing that would
              only match by combining lists from different grants.
            properties:
              budget:
                description: |-
                  Budget caps EACH exchange key this grant covers, through that key's own
                  "key:<id>" tag. When several grants cover one key the lowest maxBudget
                  applies. Removing it leaves the last ceiling in place.
                properties:
                  budgetDuration:
                    description: |-
                      BudgetDuration is the reset window LiteLLM applies, e.g. "30d".
                      Empty means the budget never resets.
                    type: string
                  maxBudget:
                    description: |-
                      MaxBudget is the ceiling in LiteLLM's spend unit (USD). Required
                      when the block is present.
                    minimum: 0
                    type: number
                required:
                - maxBudget
                type: object
              environments:
                description: Environments are exact Environment names in this namespace.
                items:
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              identity:
                description: 'Identity is exactly one ACH identity: an email, lower-case.
                  No patterns.'
                maxLength: 254
                pattern: ^[a-z0-9._%+-]+@[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
              requesters:
                description: Requesters name who may exchange.
                properties:
                  serviceAccounts:
                    description: |-
                      ServiceAccounts are exact "<namespace>/<name>" ServiceAccounts, both
                      parts DNS-1123. No patterns.
                    items:
                      maxLength: 317
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - serviceAccounts
                type: object
            required:
            - environments
            - identity
            - requesters
            type: object
          status:
            description: KeyGrantStatus is the observed state of a KeyGrant.
            properties:
              conditions:
                description: |-
                  Conditions carry Ready: False with reason IdentityUnknown (the identity
                  has never logged in to ACH) or EnvironmentMissing.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the reconciler
                  last processed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
