{{- if .Values.metrics.dashboards.enabled }}
{{- $root := . }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
# Grafana dashboard ConfigMap — opt-in via metrics.dashboards.enabled. One
# ConfigMap per JSON in the chart's dashboards/ dir (synced from
# examples/grafana by `make helm-sync`). Unlike the ServiceMonitor/PodMonitor,
# this needs NO Prometheus Operator CRD — the kube-prometheus-stack Grafana
# sidecar watches plain ConfigMaps carrying the configured label and reloads
# them, so the dashboards ship and update with the release instead of being
# hand-imported (and drifting).
#
# The sidecar honours the grafana_folder annotation ONLY when it runs with
# sidecar.dashboards.folderAnnotation=grafana_folder; without it the annotation
# is inert and dashboards land in the sidecar provider's default folder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ach-dashboard-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" $root | nindent 4 }}
    {{ $root.Values.metrics.dashboards.label }}: {{ $root.Values.metrics.dashboards.labelValue | quote }}
    {{- with $root.Values.metrics.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $root.Values.metrics.dashboards.folder }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  {{ base $path }}: |-
{{ $root.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
