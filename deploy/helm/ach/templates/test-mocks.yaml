{{- if .Values.testMocks.enabled }}
# Phase 4 e2e mocks: LiteLLM-shaped chat completion mock + MCP echo
# backend. Only rendered when .Values.testMocks.enabled=true (default
# false). Engineer toggles via `--set testMocks.enabled=true` for
# `make e2e-keep`. NEVER enable in production.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-mock-litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-litellm
    test.ach.ackstorm.ai/phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: mock-litellm
  template:
    metadata:
      annotations:
        {{- with .Values.image.rebuildId }}
        ach.ackstorm.ai/rebuild-id: {{ . | quote }}  # per-rebuild roll trigger (cluster.sh sets $(date +%s)); empty in prod
        {{- end }}
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: mock-litellm
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: {{ .Values.testMocks.image.repo }}:{{ .Values.testMocks.image.tag }}
          imagePullPolicy: {{ .Values.testMocks.image.pullPolicy | default "IfNotPresent" }}
          args: ["litellm"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: MOCK_BIND_ADDRESS
              value: ":9090"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ach-mock-litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-litellm
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-litellm
  ports:
    - name: http
      port: 80
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-mock-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-mcp
    test.ach.ackstorm.ai/phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: mock-mcp
  template:
    metadata:
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: mock-mcp
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: {{ .Values.testMocks.image.repo }}:{{ .Values.testMocks.image.tag }}
          imagePullPolicy: {{ .Values.testMocks.image.pullPolicy | default "IfNotPresent" }}
          args: ["mcp"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: MOCK_BIND_ADDRESS
              value: ":9090"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ach-mock-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-mcp
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-mcp
  ports:
    - name: http
      port: 80
      targetPort: 9090
{{- end }}
{{/*
  ach-mcp-echo is gated on its OWN toggle (testMocks.mcpEcho.enabled),
  independent of the parent testMocks.enabled. The e2e suite needs the
  JWT-validating echo backend WITHOUT the mock-litellm / mock-mcp pair
  (it drives the real LiteLLM), so enabling testMocks.enabled just to get
  mcp-echo would pull two unused mocks (and their ImagePullBackOff noise).
*/}}
{{- if .Values.testMocks.mcpEcho.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-mcp-echo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-mcp-echo
    test.ach.ackstorm.ai/phase: "4"
    test.ach.ackstorm.ai/issue: "35"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: mock-mcp-echo
  template:
    metadata:
      annotations:
        {{- with .Values.image.rebuildId }}
        ach.ackstorm.ai/rebuild-id: {{ . | quote }}  # per-rebuild roll trigger (cluster.sh sets $(date +%s)); empty in prod
        {{- end }}
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: mock-mcp-echo
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-echo
          image: {{ .Values.testMocks.mcpEcho.image.repo }}:{{ .Values.testMocks.mcpEcho.image.tag }}
          imagePullPolicy: {{ .Values.testMocks.mcpEcho.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: MOCK_BIND_ADDRESS
              value: ":9090"
            - name: ACH_JWKS_URL
              value: {{ tpl .Values.testMocks.mcpEcho.jwksUrl . | quote }}
            - name: ACH_EXPECTED_ISS
              value: {{ .Values.testMocks.mcpEcho.expectedIss | quote }}
            - name: ACH_EXPECTED_AUD
              value: {{ .Values.testMocks.mcpEcho.expectedAud | quote }}
            - name: ACH_REQUIRE_JWT
              value: {{ .Values.testMocks.mcpEcho.requireJwt | default false | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ach-mcp-echo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-mcp-echo
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-mcp-echo
  ports:
    - name: http
      port: 80
      targetPort: 9090
{{- end }}
