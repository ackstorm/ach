{{- if .Values.ingress.enabled }}
# Optional public Ingress. With the ach-gateway edge proxy in front of all
# HTTP surfaces, this Ingress routes a single backend -> ach-gateway:80.
# The gateway owns path routing (/platform, /content, /v1, /gemini, /mcp,
# /a2a, /.well-known).
#
# SECURITY: the gateway pins /metrics and /metrics/ to 404 ahead of its
# "/" catch-all (which reaches the forwarder and, through it, LiteLLM), so
# a single "/" rule here cannot leak a service's unauthenticated /metrics.
# /metrics stays an in-cluster scrape concern; do NOT add a per-service
# backend that bypasses the gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ach-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.ingress.service | default "ach-gateway" }}
                port:
                  number: {{ .Values.ingress.port | default 80 }}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
