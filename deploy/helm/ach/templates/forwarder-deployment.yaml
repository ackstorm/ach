{{- /*
ach.forwarderWorkload renders one forwarder Deployment + Service. The
default forwarder and every entry of forwarder.fronts (a second public host
such as api.<domain>, fronting the whole LiteLLM API) share this template,
the ServiceAccount/RBAC, the release namespace and every Secret — only the
name, replicas and the identity env (ACH_BASE_URL, ACH_OAUTH_ISSUER,
ACH_RAW_KEY_HEADERS) differ.
*/}}
{{- define "ach.forwarderWorkload" -}}
{{- $root := .root }}
{{- $name := .name }}
{{- $component := .component }}
{{- $replicas := .replicas }}
{{- $frontEnv := .frontEnv }}
{{- $override := list }}
{{- range $frontEnv }}{{ $override = append $override .name }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      annotations:
        # Phase 5 OBS-03 + D-12 — scrape the forwarder's main traffic
        # listener at :8080/metrics. Plan 05-06 mounts GET /metrics on
        # the chi mux alongside /v1, /v2, /gemini, /mcp, /a2a route family.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with $root.Values.image.rebuildId }}
        ach.ackstorm.ai/rebuild-id: {{ . | quote }}  # per-rebuild roll trigger (cluster.sh sets $(date +%s)); empty in prod
        {{- end }}
      labels:
        {{- include "ach.commonLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: ach-forwarder
      {{- with (include "ach.initContainers" (dict "global" $root.Values.initContainers "component" $root.Values.forwarder.initContainers)) }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # W1 (REVIEW): the JWT signing-keys Secret is loaded via the K8s
      # API client + controller-runtime informer (see
      # cmd/ach/cmd/forwarder.go buildForwarderDeps), NOT via files on
      # disk. A previous iteration mounted the Secret at /etc/ach/jwt as
      # a defense-in-depth existence check, but it was dead weight: the
      # loader never read those files, so an edit at the projected
      # volume layer would not have triggered a Reload. The API client
      # path is the single data plane; the RBAC carve-out
      # (resourceNames: ["ach-jwt-signing-keys"]) keeps the SC#4
      # contract intact without the file mount.
      containers:
        - name: forwarder
          image: {{ include "ach.image" $root }}
          imagePullPolicy: {{ include "ach.imagePullPolicy" $root }}
          args: {{ toYaml $root.Values.forwarder.args | nindent 12 }}
          ports:
            # D-03 dual-port topology.
            - name: traffic
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACH_FORWARDER_BIND_ADDRESS
              value: ":8080"
            - name: FORWARDER_HEALTH_BIND_ADDRESS
              value: ":8081"
            - name: ACH_JWT_SECRET_NAME
              value: {{ $root.Values.forwarder.jwtSecretName | default "ach-jwt-signing-keys" | quote }}
            # ACH_KEY_ENCRYPTION_KEY + ACH_CREDENTIAL_HASH_PEPPER — required at
            # rest (the forwarder opens sealed LiteLLM material with the DEK and
            # resolves pk_ via the pepper). Sourced from the security.* Secret
            # refs; do NOT also set them in extraEnv (duplicate env entries).
            {{- include "ach.securityEnv" $root | nindent 12 }}
            {{- if not (has "ACH_RAW_KEY_HEADERS" $override) }}
            {{- with $root.Values.forwarder.rawKeyHeaders }}
            - name: ACH_RAW_KEY_HEADERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- /* A front overrides the identity inputs; the same names are
                   dropped from extraEnv below so no env entry is duplicated. */}}
            {{- range $frontEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range $root.Values.forwarder.extraEnv }}
            {{- if not (has .name $override) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            {{- range $root.Values.extraEnv }}
            {{- if not (has .name $override) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            # /readyz gates on mgr cache sync AND signer.Loaded() so
            # backends never see a Forwarder that races a Sign call to
            # an empty signer.
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml $root.Values.forwarder.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: traffic
      port: 80
      targetPort: 8080
    - name: healthz
      port: 8081
      targetPort: 8081
{{- end }}

{{- if .Values.forwarder.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ach-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: forwarder
{{- include "ach.forwarderWorkload" (dict "root" . "name" "ach-forwarder" "component" "forwarder" "replicas" (.Values.forwarder.replicas | default 1) "frontEnv" (list)) }}
{{- range .Values.forwarder.fronts }}
{{- $env := list (dict "name" "ACH_BASE_URL" "value" .baseURL) (dict "name" "ACH_OAUTH_ISSUER" "value" .oauthIssuer) }}
{{- with .rawKeyHeaders }}{{ $env = append $env (dict "name" "ACH_RAW_KEY_HEADERS" "value" (join "," .)) }}{{ end }}
{{- include "ach.forwarderWorkload" (dict "root" $ "name" (printf "ach-forwarder-%s" .name) "component" (printf "forwarder-%s" .name) "replicas" (.replicas | default ($.Values.forwarder.replicas | default 1)) "frontEnv" $env) }}
{{- end }}
{{- end }}
