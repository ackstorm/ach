{{- if .Values.operator.enabled }}
---
# ClusterRole — operator informer cache watches CRD instances and Secrets
# across the cluster (or watch-namespace subset). The Secrets rule is the
# direct fix for the "cannot list resource secrets" error from
# controller-runtime's reflector. Cluster-scope is the minimal grant
# kubebuilder convention prescribes for multi-tenant CRD reconcilers;
# tighten to a namespaced Role + RoleBinding only if the deployment
# topology is single-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Secrets: read everywhere the informer cache watches (identity/channel/global storage
# credentials); create only for the UID-owned legacy workspace key. Existing key Secrets are
# never updated or deleted. No Secret verbs are ever granted to the Harness or execution SAs.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "watch"]
# ACHAgent workload children (StatefulSet/ConfigMap/Service/ServiceAccount/PVC).
# The ACHAgentReconciler is the operator's only workload-creating controller. StatefulSet,
# not Deployment, per contract §11 (control one-container StatefulSet).
- apiGroups: [""]
  resources: ["configmaps", "persistentvolumeclaims", "serviceaccounts", "services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Deployments: read+delete only, for the one-time cutover cleanup of a pre-workspace-v1
# agent's old operator-owned Deployment (pruneLegacyDeployment) — never created/updated again.
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "delete"]
# ACHAgent egress policy (AgentProfile.spec.networkPolicy). Rendered per agent,
# pruned when the profile drops the block.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Per-agent Harness workspace-creator Role/RoleBinding (buildWorkspaceRole/
# buildWorkspaceRoleBinding, named ach-harness-<uid>, contract §11 creator contract) — no
# blanket bind/escalate grant: the operator only ever creates these two fixed, UID-named
# objects with a fixed rule set.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Legacy cutover cleanup ONLY (pruneLegacySandbox): a pre-workspace-v1 sandboxed ACHAgent's
# agent-sandbox SandboxTemplate/SandboxWarmPool (cluster prerequisite; inert when the CRDs are
# absent). The operator never creates, updates, or watches these kinds again.
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxtemplates", "sandboxwarmpools"]
  verbs: ["get", "delete"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - artifacts
  - backendidentitypolicies
  - environments
  - litellmconnections
  - pluginmarketplaces
  - plugins
  - prompts
  - skills
  - skillmarketplaces
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# ACHAgent is user-owned: the operator watches + patches status, never
# creates/deletes it. AgentProfile is read-only (no reconciler).
- apiGroups: ["ach.ackstorm.ai"]
  resources: ["achagents"]
  verbs: ["get", "list", "patch", "update", "watch"]
- apiGroups: ["ach.ackstorm.ai"]
  resources: ["agentprofiles"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - artifacts/finalizers
  - backendidentitypolicies/finalizers
  - environments/finalizers
  - litellmconnections/finalizers
  - pluginmarketplaces/finalizers
  - plugins/finalizers
  - prompts/finalizers
  - skills/finalizers
  - skillmarketplaces/finalizers
  verbs: ["update"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - achagents/status
  - artifacts/status
  - backendidentitypolicies/status
  - environments/status
  - litellmconnections/status
  - pluginmarketplaces/status
  - plugins/status
  - prompts/status
  - skills/status
  - skillmarketplaces/status
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-operator
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
---
# Leader-election: controller-runtime acquires a Lease in the operator's
# own namespace. Namespaced Role + RoleBinding is the tighter binding for
# this; cluster-scope is not required here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator-leader-election
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
---
# Namespaced Role: lets the operator MINT the ach-jwt-signing-keys Secret
# (internal/operator/jwtkeys.EnsureSigningKeys — a random Ed25519 seed minted
# once and persisted, FWD-09). Minimal grant: `create` only, namespace-scoped.
#
# NOTE: Kubernetes RBAC cannot restrict `create` by resourceNames (the object
# name is unknown at admission), so a namespaced Role is the tightest scope
# achievable — not the cluster-wide operator ClusterRole. The existence check
# (get, to no-op when present) is already covered by the operator ClusterRole's
# secrets get;list;watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator-jwt-signing
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
{{- end }}
