{{- if .Values.operator.enabled }}
---
# The operator reads and reconciles its own namespace only: its cache watches
# ACH_NAMESPACE, which the Deployment sets to the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
# Creating the ach-jwt-signing-keys Secret is the operator-jwt-signing Role below.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - artifacts
  - backendidentitypolicies
  - environments
  - litellmconnections
  - pluginmarketplaces
  - plugins
  - prompts
  - instructions
  - skills
  - skillmarketplaces
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# KeyGrant: read and finalizer only — the operator never authors a grant
# (writing one is acting as its identity). update is what adding and removing
# the finalizer takes. update also allows editing a grant's spec; that is
# accepted because the operator already holds the LiteLLM master key and can
# act with any identity's authority without a KeyGrant.
- apiGroups: ["ach.ackstorm.ai"]
  resources: ["keygrants"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - artifacts/finalizers
  - backendidentitypolicies/finalizers
  - environments/finalizers
  - keygrants/finalizers
  - litellmconnections/finalizers
  - pluginmarketplaces/finalizers
  - plugins/finalizers
  - prompts/finalizers
  - instructions/finalizers
  - skills/finalizers
  - skillmarketplaces/finalizers
  verbs: ["update"]
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - artifacts/status
  - backendidentitypolicies/status
  - environments/status
  - keygrants/status
  - litellmconnections/status
  - pluginmarketplaces/status
  - plugins/status
  - prompts/status
  - instructions/status
  - skills/status
  - skillmarketplaces/status
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
---
# Leader-election: controller-runtime acquires a Lease in the operator's
# own namespace. Namespaced Role + RoleBinding is the tighter binding for
# this; cluster-scope is not required here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator-leader-election
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
---
# Namespaced Role: lets the operator MINT the ach-jwt-signing-keys Secret
# (internal/operator/jwtkeys.EnsureSigningKeys — a random Ed25519 seed minted
# once and persisted, FWD-09). Minimal grant: `create` only, namespace-scoped.
#
# NOTE: Kubernetes RBAC cannot restrict `create` by resourceNames (the object
# name is unknown at admission), so a namespaced Role is the tightest scope
# achievable. The existence check (get, to no-op when present) is covered by
# the operator Role's secrets get;list;watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator-jwt-signing
subjects:
- kind: ServiceAccount
  name: ach-operator
  namespace: {{ .Release.Namespace }}
{{- end }}
