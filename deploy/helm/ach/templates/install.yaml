apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: forwarder
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ach
  name: ach-ach-forwarder
  namespace: ach-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: forwarder
      app.kubernetes.io/name: ach
  template:
    metadata:
      labels:
        app.kubernetes.io/component: forwarder
        app.kubernetes.io/name: ach
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - forwarder
        env:
        - name: ACH_CREDENTIAL_HASH_PEPPER
          valueFrom:
            secretKeyRef:
              key: pepper
              name: ach-credential-hash-pepper
        - name: ACH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: FORWARDER_HEALTH_BIND_ADDRESS
          value: :8081
        image: ghcr.io/ackstorm/ach:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: forwarder
        ports:
        - containerPort: 8081
          name: healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ach-forwarder
      terminationGracePeriodSeconds: 10
