---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ach
    control-plane: controller-manager
  name: ach-controller-manager
  namespace: ach-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: ach
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - operator
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /ach
        env:
        - name: WATCH_NAMESPACE
          value: {{ .Values.watchNamespace }}
        {{- range .Values.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        image: {{ .Values.image.repo }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ach-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []

---
{{- if .Values.metrics.serviceMonitor.enabled }}
# ServiceMonitor stub — generated by scripts/kustomize-to-helm.sh (plan 07-02 D-02).
# This block is activated when metrics.serviceMonitor.enabled=true.
# When prometheus-operator is installed and a ServiceMonitor is added to
# config/default/prometheus/ and included in config/default/kustomization.yaml,
# `make helm-sync` will replace this stub with the rendered ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ach-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: helm
spec:
  selector:
    matchLabels:
      control-plane: ach
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
