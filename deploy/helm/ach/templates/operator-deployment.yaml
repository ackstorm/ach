{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ach-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ach-operator-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.operator.cacheSize | default "10Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        # Prometheus default scrape — Phase 5 OBS-03 + D-12.
        # Drift flag #4 resolution: this Pod hosts TWO metrics ports
        # (operator :8080, content-service :8082). Pod annotation here
        # covers the OPERATOR port. The content-service port has its
        # own scrape target via Service-level annotation on
        # ach-content-service (see content-service-deployment.yaml).
        # See examples/prometheus-servicemonitor.yaml for the
        # ServiceMonitor alternative.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: ach-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ach-operator-cache
      containers:
        - name: manager
          image: {{ include "ach.image" . }}
          imagePullPolicy: {{ include "ach.imagePullPolicy" . }}
          args: {{ toYaml .Values.operator.args | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          env:
            - name: ACH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACH_CACHE_ROOT
              value: /var/cache/ach
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ach
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- if .Values.contentService.enabled }}
        # Content-service co-located in the same Pod as the operator
        # (Phase 1 SC#2 invariant per ROADMAP). Both containers share
        # the RWO ach-operator-cache PVC: the operator writes via
        # cachefs.PublishExternal (atomic rename) and the content-
        # service reads-only via sendfile(2). RWO mandates single-Pod
        # mounters, hence co-location. If the storage class is upgraded
        # to RWX (EFS/NFS/CephFS) this Pod can later be split.
        - name: content-service
          image: {{ include "ach.image" . }}
          imagePullPolicy: {{ include "ach.imagePullPolicy" . }}
          args: {{ toYaml .Values.contentService.args | nindent 12 }}
          ports:
            - name: cs-http
              containerPort: 8082
          env:
            - name: ACH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACH_CACHE_ROOT
              value: /var/cache/ach
            - name: CONTENT_SERVICE_HEALTH_BIND_ADDRESS
              value: ":8082"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ach
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.contentService.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
{{- end }}
