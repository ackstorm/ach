{{- if .Values.forwarder.enabled }}
---
# Forwarder reads:
#   - environments + backendidentitypolicies (cached informers; D-22)
#   - litellmconnections (one-shot APIReader.Get at bootstrap so the
#     forwarder discovers the LiteLLM upstream + master-key Secret ref
#     from LiteLLMConnection/default per B2 refactor — replaces the
#     prior ACH_LITELLM_BASE_URL + ACH_LITELLM_SHARED_KEY env vars)
#   - ach-jwt-signing-keys Secret (resourceNames carve-out per D-22)
#   - the masterKey Secret named by LiteLLMConnection's
#     MasterKeySecretRef (resourceNames carve-out — chart value
#     forwarder.litellmMasterSecretName, default litellm-master-key,
#     MUST match the CR's spec.masterKeySecretRef.name)
#
# External-reference kinds (plugins/prompts/artifacts/pluginmarketplaces)
# are served from the PVC cache (T-09-02 mitigation), so they are
# deliberately excluded. Namespace-scoped Role (not ClusterRole) per
# MULTI-01 — multi-tenant deployments isolate per-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: forwarder
rules:
- apiGroups: ["ach.ackstorm.ai"]
  resources:
  - environments
  - backendidentitypolicies
  verbs: ["get", "list", "watch"]
- apiGroups: ["ach.ackstorm.ai"]
  resources: ["litellmconnections"]
  resourceNames: ["default"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - "{{ .Values.forwarder.jwtSecretName | default "ach-jwt-signing-keys" }}"
  - "{{ .Values.forwarder.litellmMasterSecretName | default "litellm-master-key" }}"
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: forwarder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-forwarder
subjects:
- kind: ServiceAccount
  name: ach-forwarder
  namespace: {{ .Release.Namespace }}
{{- end }}
