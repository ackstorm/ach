{{- if .Values.platformApi.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
---
# Admin allowlist (one email per line, # for comments). Empty by default
# — populate via .Values.platformApi.admins to enable admin endpoints
# (otherwise platform-api logs "parsed to zero admins" and returns 403
# not_admin from every admin route, which is the safe default-deny).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ach-platform-api-admins
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
data:
  admins.txt: |
    {{- range .Values.platformApi.admins | default list }}
    {{ . }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  replicas: {{ .Values.platformApi.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      annotations:
        # Phase 5 OBS-03 + D-12 — scrape platform-api /metrics on the
        # main traffic listener. Plan 05-06 mounts GET /metrics on the
        # chi mux. Shared litellm_unreachable_total counter registered
        # here for caller="platform_api".
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform-api
    spec:
      serviceAccountName: ach-platform-api
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: admins
          configMap:
            name: ach-platform-api-admins
      containers:
        - name: platform-api
          image: {{ include "ach.image" . }}
          imagePullPolicy: {{ include "ach.imagePullPolicy" . }}
          args: {{ toYaml .Values.platformApi.args | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{ toYaml .Values.platformApi.resources | nindent 12 }}
          volumeMounts:
            - name: admins
              mountPath: /etc/ach/admins
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: platform-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
