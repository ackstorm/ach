{{- if .Values.platformApi.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  replicas: {{ .Values.platformApi.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        {{- include "ach.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform-api
    spec:
      serviceAccountName: ach-platform-api
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: {{ include "ach.image" . }}
          imagePullPolicy: {{ include "ach.imagePullPolicy" . }}
          args: {{ toYaml .Values.platformApi.args | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{ toYaml .Values.platformApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ach-platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: platform-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
