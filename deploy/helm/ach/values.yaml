# deploy/helm/ach/values.yaml
#
# Single-binary, multi-component design. One image (ghcr.io/ackstorm/ach)
# carries operator, platform-api, forwarder, content-service, migrate modes
# selected by `args:` on each Deployment. Per-mode toggles allow installs to
# enable only the components they need (operator-only baseline, full hub, etc).
#
# CRDs are installed by default (helm.sh/resource-policy: keep). External
# Postgres and Redis are assumed — embedded subcharts are out of scope for
# the v0.0.1 baseline; use bitnami/postgresql + bitnami/valkey alongside.

# installCRDs: when true (default), the chart ships every CRD in
# crd-sources/ as a managed Helm resource. `helm upgrade` then upgrades
# CRDs the same way it upgrades every other resource. Each CRD carries
# `helm.sh/resource-policy: keep` so `helm uninstall` preserves them
# (and the user's CRs) intact. Set false when CRDs are managed out-of-band
# (Flux/ArgoCD Kustomization, kubectl apply in CD).
installCRDs: true

# image: the single ach binary, with per-mode args on each Deployment.
# pullPolicy default is IfNotPresent so the kind workflow (cluster.sh /
# `kind load docker-image`) uses the locally-loaded image — kind nodes
# have no ghcr.io/ackstorm/* credentials, so `Always` would force an
# anonymous pull that 401s into ImagePullBackOff (issue #38). Production
# deploys that want re-tag hygiene override to `Always` via a values
# overlay or `--set image.pullPolicy=Always`.
image:
  repo: ghcr.io/ackstorm/ach
  tag: v0.6.23
  pullPolicy: IfNotPresent
  # rebuildId: a unique value per build (e.g. a timestamp) rendered as the
  # `ach.ackstorm.ai/rebuild-id` pod annotation on every ach Deployment.
  # When set, the podTemplate changes each `helm upgrade`, so Helm rolls
  # all pods — needed because the kind dev loop rebuilds the SAME tag
  # (`:e2e`) with pullPolicy=IfNotPresent, which otherwise yields a
  # byte-identical spec and no rollout. Empty default = annotation absent
  # = no spurious rolls in production. scripts/cluster.sh sets it to
  # `$(date +%s)` on each hydrate_ach.
  rebuildId: ""

# watchNamespace: empty = cluster-scoped; non-empty = namespace-scoped.
# Maps to WATCH_NAMESPACE env var on operator Deployment.
watchNamespace: ""

# operator: reconciles ACH CRDs (AgentDefinition, AgentSession, etc).
#
# Default args bind the controller-runtime metricsserver on :8080
# (HTTP, no auth) so the Pod-level prometheus.io/scrape annotation
# in operator-deployment.yaml actually resolves to a live endpoint.
# Phase 5 OBS-03..06 + SC#5 wiring — the operator's :8080/metrics
# surfaces controller_runtime_reconcile_*, workqueue_*, plus the
# shared ach_litellm_unreachable_total{caller="operator"} registered by
# Plan 05-06 Task 5.
#
# To switch to secure metrics (TLS + authn/authz on :8443) for
# deployers running cert-manager + Prometheus with bearer-token
# auth, override operator.args via --set or values overlay:
#   operator:
#     args:
#       - operator
#       - --metrics-bind-address=:8443
#       - --metrics-secure=true
operator:
  enabled: true
  replicas: 1
  resources: {}
  args:
    - operator
    - --metrics-bind-address=:8080
    - --metrics-secure=false
  # cache: the ach-operator-cache PVC backing the artifact cache shared with
  # content-service. Default is RWO single-mounter co-location (sidecar). To
  # split content-service into its own Deployment for HA (G16), set
  # accessMode=ReadWriteMany + an RWX storageClassName (efs-sc / nfs-client /
  # cephfs) AND contentService.standalone=true.
  cache:
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClassName: ""
  # ─── orphan-cleanup loop (OP-15 / Hub §18.4) ───
  # The loop revokes ONLY ACH-minted LiteLLM keys (metadata.ach_key_id
  # present) that ACH no longer tracks as active; foreign keys (manual /
  # tf-* / token-factory) are never touched. Tune via the top-level
  # `extraEnv` (these are operator-only; other modes ignore them):
  #   ACH_ORPHAN_CLEANUP_INTERVAL   (default 1h; floor 5m) — tick cadence.
  #       Emergency stop: set very high (e.g. 8760h) to neuter the loop for
  #       the pod's lifetime without a rebuild (first tick fires at
  #       t+interval, so a year-long interval never fires).
  #   ACH_ORPHAN_CLEANUP_DRY_RUN    (default false) — B3 reversible neutralize:
  #       logs "WOULD revoke" + skipped{dry_run} metric, never calls RevokeKey.
  #       A malformed value (tru/yes/on) FAILS operator startup (parsed strictly),
  #       so a typo can never silently re-enable real revocation.
  #   ACH_ORPHAN_CLEANUP_MAX_REVOKE (default 10) — B2 circuit-breaker: a tick
  #       with more true-orphan candidates than this aborts revocation entirely.
  # Observability: /metrics exposes ach_orphan_cleanup_{candidates,revoked}_total
  # and ach_orphan_cleanup_skipped_total{reason}.
  #
  # ACH_PUBLIC_BASE_URL (also top-level `extraEnv`, operator-only): the
  # externally reachable gateway origin (e.g. https://ach.example.com). When
  # set, the operator renders ACHAgent status.gatewayURL as a full URL;
  # unset => status.gatewayURL is the path-only form
  # (/agents/{ns}/achagent-{name}).
  # Falls back to ACH_BASE_URL when unset — the common single-ingress
  # deployment needs only ACH_BASE_URL in extraEnv; set ACH_PUBLIC_BASE_URL
  # separately only when the public webhook ingress differs from
  # platform-api's own origin.

# platformApi: HTTP API surface for agent registry, config serving.
platformApi:
  enabled: true
  replicas: 1
  resources: {}
  args: ["platform-api"]

# forwarder: bridges in-cluster MCP servers and external clients.
# §5.1 reverse-proxy plane + §9 JWT trust path. Boots two listeners:
# traffic :8080 (D-04 WriteTimeout=0 for SSE) and health :8081.
forwarder:
  enabled: true
  replicas: 1
  resources: {}
  args: ["forwarder"]
  # jwtSecretName names the Secret holding current/next Ed25519 signing
  # material per D-10 (data keys: current.kid, current.seed, next.kid?,
  # next.seed?). The operator MINTS + persists this Secret on boot
  # (internal/operator/jwtkeys.EnsureSigningKeys — random seed, mint-once),
  # via a minimal namespaced `secrets: create` Role. The forwarder
  # refuse-to-starts until it exists (FWD-09), then boots. The Secret is
  # operator-owned (not Helm-managed), so it survives `helm uninstall` and a
  # reinstall reuses the same key — no JWKS rotation. To force rotation,
  # delete the Secret and let the operator re-mint.
  jwtSecretName: ach-jwt-signing-keys
  # The LiteLLM master-key Secret the forwarder reads at boot is sourced
  # from the single litellmConnection.masterKeySecretRef block (name + key,
  # plus an optional cross-namespace `namespace`). The forwarder RBAC scopes
  # to it automatically — there is no longer a per-forwarder master-key knob
  # to keep in sync (the deprecated litellmMasterSecretName + litellmMasterKey
  # were removed; set litellmConnection.masterKeySecretRef.namespace for the
  # cross-namespace case, issue #34 C7).
  #
  # extraEnv supplies env vars (ACH_BASE_URL, ACH_DB_URL, ACH_REDIS_ADDR,
  # ACH_REDIS_PASSWORD via valueFrom). The DEK + pepper are sourced from the
  # top-level `security` block, NOT here; the LiteLLM endpoint + master key
  # flow from LiteLLMConnection/default + its MasterKeySecretRef at bootstrap
  # (see internal/forwarder/litellmconn.Resolve).
  extraEnv: []

# litellmConnection — the SINGLE place to configure the ACH↔LiteLLM wire.
# Configure endpoint + master-key Secret ref here ONCE; the chart fans it
# out to every consumer:
#   - renders LiteLLMConnection/default (operator reconciles it → Postgres
#     projection that the forwarder + Environment controller read), and
#   - derives ACH_LITELLM_BASE_URL + ACH_LITELLM_MASTER_KEY env for
#     platform-api + content-service (via the ach.litellmConnectionEnv
#     helper), and
#   - points the forwarder's master-key Secret RBAC at the same Secret.
# Do NOT also set ACH_LITELLM_* in extraEnv — that is the duplication this
# block removes. The Secret named here must exist in the release namespace
# (create it out-of-band, e.g. a pre-install step).
litellmConnection:
  enabled: true
  endpoint: http://litellm.litellm.svc.cluster.local:4000
  masterKeySecretRef:
    name: litellm-master-key
    key: master_key
    # namespace: optional cross-namespace override (issue #34 C7). Empty
    # resolves to the release namespace. Set this only when the master-key
    # Secret lives in a different namespace from the release — the forwarder
    # RBAC then renders a cross-namespace Role + RoleBinding scoped to
    # masterKeySecretRef.name. (Replaces the removed forwarder.litellmMasterKey.)
    namespace: ""

# security — at-rest crypto material that platform-api AND the forwarder
# REQUIRE at startup (validateConfig aborts the process otherwise). Both are
# referenced from operator-supplied Secrets — the chart never generates or
# inlines them, because they MUST stay stable across upgrades:
#   - rotating the DEK orphans all sealed LiteLLM key material;
#   - rotating the pepper invalidates every stored credential hash.
# Create the Secrets out-of-band BEFORE install/upgrade, e.g.:
#   kubectl -n <ns> create secret generic ach-key-encryption-key \
#     --from-literal=dek="$(openssl rand -base64 32)"      # 32 raw bytes, base64
#   kubectl -n <ns> create secret generic ach-credential-hash-pepper \
#     --from-literal=pepper="$(openssl rand -base64 32)"   # random, ≥32 bytes
security:
  # keyEncryptionKey → ACH_KEY_ENCRYPTION_KEY. The referenced value MUST be
  # base64 of exactly 32 bytes (AES-256). Used by platform-api (seal) and the
  # forwarder (open) for LiteLLM key material at rest.
  keyEncryptionKey:
    secretRef:
      name: ach-key-encryption-key
      key: dek
  # credentialHashPepper → ACH_CREDENTIAL_HASH_PEPPER. Server-side
  # HMAC-SHA256 pepper for pk_/ek_ credential hashing; never persisted.
  credentialHashPepper:
    secretRef:
      name: ach-credential-hash-pepper
      key: pepper

# gateway: the ACH edge reverse proxy (ach gateway mode). Fronts the
# platform-api, content-service, and forwarder HTTP surfaces behind one
# origin so the public Ingress targets a single Service. It performs no
# auth and never routes /metrics or /dex (see internal/gateway). ClusterIP
# by default; the public Ingress (ingress.enabled) points here.
gateway:
  enabled: true
  replicas: 1
  resources: {}
  args: ["gateway"]
  # extraEnv supplies optional overrides (e.g. ACH_GATEWAY_BIND_ADDRESS).
  # POD_NAMESPACE is injected via the downward API in the template.
  # ACH_DB_URL is REQUIRED (here or top-level extraEnv) — the gateway
  # refuses to start without it; the achagents projection is the allowlist
  # for /agents/{ns}/{service}/... routing to per-agent Services.
  extraEnv: []

# contentService: serves agent-rendered content (assets, snapshots).
contentService:
  enabled: true
  # standalone: false (default) → content-service runs as a sidecar in the
  # operator Pod (RWO cache PVC, co-located). true → run as its own
  # Deployment with `replicas` replicas (G16 HA split). Requires an RWX
  # cache: set operator.cache.accessMode=ReadWriteMany + a
  # operator.cache.storageClassName so multiple Pods can mount the PVC.
  standalone: false
  replicas: 1
  resources: {}
  args: ["content-service"]

# migrate: pre-install Job that runs schema migrations against Postgres.
migrate:
  enabled: true
  args: ["migrate"]

ingress:
  enabled: false
  # className -> spec.ingressClassName. Empty = the cluster's default
  # IngressClass (the one annotated ingressclass.kubernetes.io/is-default-class).
  className: ""
  # host: public hostname. Empty = a catch-all rule (no host match). Set
  # your domain in production.
  host: ""
  # annotations on the Ingress object (e.g. cert-manager.io/cluster-issuer,
  # nginx.ingress.kubernetes.io/* tuning).
  annotations: {}
  # tls: passed through verbatim to spec.tls — list of {hosts: [...], secretName: ...}.
  tls: []
  # The Ingress sends ONE backend to the ach-gateway Service, which owns
  # all path routing. Override path/service/port only for unusual edge
  # topologies. /metrics is NOT routable through the gateway by design.
  path: /
  pathType: Prefix
  service: ach-gateway
  port: 80

# metrics: Prometheus observability topology — Phase 5 OBS-03..06.
#
# Each long-running service exposes GET /metrics on its main traffic
# listener:
#   - operator:        :8080 (controller-runtime metricsserver)
#   - platform-api:    :8080 (chi mux)
#   - forwarder:       :8080 (chi mux)
#   - content-service: :8082 (chi mux, co-located in operator Pod)
#
# /metrics is UNAUTHENTICATED — internal cluster network only.
# DEPLOYERS MUST NOT expose /metrics through Ingress, LB, or external
# routing. The operator's controller-runtime metricsserver may be
# configured for TLS+auth via --metrics-secure (see operator subcommand
# flags); the other three are plain HTTP.
#
# Scrape topology (drift flag #4 — operator Pod has two metric ports):
#   - operator's :8080 → Pod-level prometheus.io/scrape annotation
#     on the operator Pod template.
#   - content-service's :8082 → Service-level prometheus.io/scrape
#     annotation on the ach-content-service Service object (the Pod
#     is shared with the operator container, so a single Pod-level
#     annotation cannot name both ports).
#   - forwarder + platform-api → Pod-level annotations on their own
#     Pod templates.
#
# ach-agent Pods (dynamic — one Deployment per ACHAgent) expose /metrics on
# their health port (default :8000, same server as /healthz + /readyz). They
# have no dedicated Service, so scrape them via a PodMonitor: set
# metrics.podMonitor.enabled=true (selector app.kubernetes.io/name=ach-agent).
#
# Prometheus Operator users: set metrics.serviceMonitor.enabled=true
# (below) to render a ServiceMonitor as an alternative to the default
# pod-scrape annotations. examples/prometheus-servicemonitor.yaml is the
# equivalent standalone manifest for non-Helm / reference use.
#
# Spec v4 §5.2 RBAC reversal — Content Service no longer holds
# informers over ACH CRDs (Phase 5 D-Discretion + Plan 05-06). The
# contract is enforced AT THE GO CODE LEVEL: cmd/ach/cmd/content_service.go
# does NOT construct a controller-runtime manager.Manager. At the
# K8s RBAC level the CS container shares the ach-operator
# ServiceAccount (RWO PVC co-location), so `kubectl auth can-i list
# environments.ach.ackstorm.ai --as=system:serviceaccount:<ns>:ach-operator`
# returns "yes" — that grant is needed by the OPERATOR reconcilers
# (Phase 1 Plan 01-09); CS code never exercises it.
#
# metrics.serviceMonitor: render a prometheus-operator ServiceMonitor
# (templates/servicemonitor.yaml) covering forwarder, platform-api,
# content-service and operator metrics. enabled=false (default) → render
# nothing and rely on the pod-level prometheus.io/scrape annotations above.
# Set enabled=true ONLY when the Prometheus Operator CRDs are installed —
# otherwise `helm install` fails with `no matches for kind "ServiceMonitor"`.
metrics:
  serviceMonitor:
    enabled: false
    # interval: scrape interval; empty → Prometheus global default.
    interval: 30s
    # scrapeTimeout: per-scrape timeout (must be ≤ interval); empty → default.
    scrapeTimeout: ""
    # labels: extra labels on the ServiceMonitor so your Prometheus's
    # serviceMonitorSelector matches it (kube-prometheus-stack commonly
    # requires `release: <prometheus-release-name>`).
    labels: {}
  # metrics.podMonitor: render a prometheus-operator PodMonitor
  # (templates/podmonitor.yaml) scraping /metrics on every ach-agent Pod
  # (selector app.kubernetes.io/name=ach-agent) via its named health port.
  # Agent Pods are created dynamically by the operator (one Deployment per
  # ACHAgent) and — unlike the four services — a plain agent has no Service, so
  # a PodMonitor (pod-direct) is the fit, not a ServiceMonitor. enabled=false
  # (default) → render nothing. Set enabled=true ONLY when the Prometheus
  # Operator CRDs are installed — otherwise `helm install` fails with `no matches
  # for kind "PodMonitor"`. namespaceSelector defaults to the release namespace
  # (widen it in templates/podmonitor.yaml if agents run elsewhere).
  podMonitor:
    enabled: false
    # interval: scrape interval; empty → Prometheus global default.
    interval: 30s
    # scrapeTimeout: per-scrape timeout (must be ≤ interval); empty → default.
    scrapeTimeout: ""
    # labels: extra labels so your Prometheus's podMonitorSelector matches it
    # (kube-prometheus-stack commonly requires `release: <prometheus-release-name>`).
    labels: {}
  # metrics.prometheusRule: render a prometheus-operator PrometheusRule
  # (templates/prometheusrule.yaml) with the recommended ACH alert rules.
  # enabled=false (default) → render nothing. Set enabled=true ONLY when the
  # Prometheus Operator CRDs are installed — otherwise `helm install` fails
  # with `no matches for kind "PrometheusRule"`.
  prometheusRule:
    enabled: false
    # labels: extra labels so your Prometheus's ruleSelector matches it
    # (kube-prometheus-stack commonly requires `release: <prometheus-release-name>`).
    labels: {}
    # includeP1Alerts: the two alerts on operator metrics
    # (ACHExternalRefRefreshFailed, ACHEnvironmentUnavailable). Both metrics
    # are exposed by the operator — ach_operator_external_ref_refresh_total
    # (external_ref_driver.go) and ach_environment_available
    # (environment_controller.go) — so these alerts are enabled by default.
    includeP1Alerts: true
  # metrics.dashboards: ship the ACH Grafana dashboards
  # (templates/grafana-dashboards.yaml) as one ConfigMap per dashboard, labelled
  # for the kube-prometheus-stack Grafana sidecar to auto-load. Needs NO
  # Prometheus Operator CRD — plain ConfigMaps — so it is safe to enable
  # wherever that sidecar runs (sidecar.dashboards.enabled=true, which is the
  # kube-prometheus-stack default). The JSON lives in the chart's dashboards/
  # dir, synced from examples/grafana by `make helm-sync`.
  dashboards:
    enabled: false
    # label/labelValue: must match the sidecar's LABEL/LABEL_VALUE
    # (kube-prometheus-stack defaults: grafana_dashboard / "1").
    label: grafana_dashboard
    labelValue: "1"
    # folder: value of the grafana_folder annotation — honoured only when the
    # sidecar runs with sidecar.dashboards.folderAnnotation=grafana_folder.
    # Empty → no annotation, dashboards land in the sidecar provider's folder.
    folder: ACH
    # labels: extra labels on every dashboard ConfigMap.
    labels: {}

# extraEnv: list of additional env vars to inject into every component's
# main container. Each item is {name, value}.
extraEnv: []
