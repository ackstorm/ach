# Phase 1 — credential-hash pepper Secret (Hub §16.1 / D-09 / D-10).
#
# The HMAC-SHA-256 pepper for credential hashing is held outside Postgres in
# a Kubernetes Secret. Components that may hash credentials (operator,
# platform-api, forwarder, content-service) mount this Secret as the env
# var ACH_CREDENTIAL_HASH_PEPPER via valueFrom.secretKeyRef.
#
# PHASE 1 DEVELOPMENT PLACEHOLDER.
# Production deployments MUST replace this value before `kubectl apply`.
# The pepper MUST be at least 32 bytes of cryptographic randomness.
# Generate with: openssl rand -base64 32
#
# The Plan 11 verifier e2e contract (B2) asserts that the operator binary
# REFUSES to start when this literal placeholder value is present —
# `cmd/operator/main.go` checks `strings.HasPrefix(pepper, "REPLACE-ME-
# WITH-RANDOM-")` and `os.Exit(1)`. Plan 08 ships the placeholder; Plan 06
# ships the runtime rejection.
---
apiVersion: v1
kind: Secret
metadata:
  name: ach-credential-hash-pepper
  namespace: system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
  annotations:
    ach.ackstorm.ai/placeholder: "true"
    ach.ackstorm.ai/replace-before-prod: "Generate with openssl rand -base64 32"
type: Opaque
stringData:
  pepper: "REPLACE-ME-WITH-RANDOM-32-BYTES-FROM-OPENSSL-RAND-BASE64-32"
