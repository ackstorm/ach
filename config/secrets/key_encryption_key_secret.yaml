# G3 — key-encryption-key (DEK) Secret.
#
# The AES-256 data-encryption key used to seal LiteLLM virtual-key material at
# rest (keycrypt) is held outside Postgres in a Kubernetes Secret. The two
# components that handle that material — platform-api (seals on mint) and
# forwarder (opens on use) — mount this Secret as the env var
# ACH_KEY_ENCRYPTION_KEY via valueFrom.secretKeyRef.
#
# DEVELOPMENT PLACEHOLDER.
# Production deployments MUST replace this value before `kubectl apply`.
# The DEK MUST be base64 of EXACTLY 32 bytes of cryptographic randomness.
# Generate with: openssl rand -base64 32
#
# platform-api + forwarder REFUSE to start when this literal placeholder value
# is present — internal/keycrypt/dekenv rejects the "REPLACE-ME-WITH-RANDOM-"
# prefix (and any value that is not exactly 32 decoded bytes).
---
apiVersion: v1
kind: Secret
metadata:
  name: ach-key-encryption-key
  namespace: system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
  annotations:
    ach.ackstorm.ai/placeholder: "true"
    ach.ackstorm.ai/replace-before-prod: "Generate with openssl rand -base64 32"
type: Opaque
stringData:
  dek: "REPLACE-ME-WITH-RANDOM-32-BYTES-FROM-OPENSSL-RAND-BASE64-32"
