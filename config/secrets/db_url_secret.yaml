# Phase 1 — Postgres connection URL Secret (D-08).
#
# Consumed by the operator container AND the migrate init container in the
# Operator Pod (config/manager/manager.yaml). Phase 3+ Platform API and
# Phase 4+ Forwarder will also reference this Secret.
#
# PHASE 1 DEVELOPMENT PLACEHOLDER — replace before deploy.
# Format: postgres://user:pass@host:5432/dbname?sslmode=require
#
# Phase 7 Helm chart will replace this with `--set`-driven values or
# external-secrets references.
---
apiVersion: v1
kind: Secret
metadata:
  name: ach-db-url
  namespace: system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
  annotations:
    ach.ackstorm.ai/placeholder: "true"
    ach.ackstorm.ai/replace-before-prod: "postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require"
type: Opaque
stringData:
  url: "postgres://ach:ach@ach-postgres.system.svc.cluster.local:5432/ach?sslmode=disable"
