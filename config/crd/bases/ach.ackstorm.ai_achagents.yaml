---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: achagents.ach.ackstorm.ai
spec:
  group: ach.ackstorm.ai
  names:
    kind: ACHAgent
    listKind: ACHAgentList
    plural: achagents
    shortNames:
    - agent
    singular: achagent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.gatewayURL
      name: Gateway
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ACHAgent is a running agent instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ACHAgentSpec defines the desired state of an agent instance.
            properties:
              ach:
                description: |-
                  AchEndpointSpec is the ACH platform coordinate (config: capability.ach.baseUrl + ACH_BASE_URL env).
                  BaseURL is optional: it resolves as ACHAgent.spec.ach.baseUrl ?? AgentProfile.spec.achagent.ach.baseUrl ??
                  operator ACH_BASE_URL env (agentrender.ResolveAchBaseURL). An empty result blocks the agent.
                properties:
                  baseUrl:
                    type: string
                type: object
              capability:
                description: |-
                  Capability is optional: both of its fields are optional, so the block
                  validates nothing on its own. Render always emits a capability block
                  (the harness schema requires one) — capability.ach.baseUrl comes from
                  agentrender.ResolveAchBaseURL, never from here.
                properties:
                  environment:
                    description: |-
                      Environment is the ACH Hub Environment name, for documentation/intent only.
                      The ek already scopes the environment server-side, and the harness reads the
                      hydrated environment (manifest.environment) — NOT this field. Optional: omit
                      to let the ek decide; when set it is rendered but never authoritative.
                    type: string
                  filter:
                    description: FilterSpec wraps the exclude gate.
                    properties:
                      exclude:
                        description: 'ExcludeSpec is the governance gate ABOVE the
                          model (config: capability.filter.exclude).'
                        properties:
                          mcpServers:
                            items:
                              type: string
                            type: array
                          skills:
                            items:
                              type: string
                            type: array
                          tools:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                type: object
              channels:
                items:
                  description: 'ChannelSpec is one inbound channel (config: channels[]).'
                  properties:
                    a2a:
                      description: 'A2ASpec configures an a2a channel (config: channels[].a2a;
                        mode async-only in v1).'
                      properties:
                        auth:
                          description: 'A2AAuthSpec configures a2a inbound auth (config:
                            channels[].a2a.auth; secretRef → secretPath).'
                          properties:
                            header:
                              default: x-a2a-custom-api-key
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretRef
                          type: object
                      required:
                      - auth
                      type: object
                    cleanup:
                      description: |-
                        Cleanup runs when a reserved session is torn down: after an acquired engine is stopped,
                        or after prepare/engine-acquire failure before acquisition completes. It is best-effort:
                        failures are logged and counted without changing invocation delivery. Graceful shutdown
                        attempts cleanup; abrupt Pod or node termination cannot guarantee it. Requires prepare.
                      properties:
                        forwardEnv:
                          description: |-
                            ForwardEnv selects names from the merged AgentProfile.spec.env + ACHAgent.spec.env.
                            Literal values become the hook's env; secretKeyRef values become its secretEnv via
                            generated Pod aliases. Unknown names are ignored and remain unset.
                          items:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        script:
                          description: |-
                            Script is the static /bin/sh program. Lifecycle hooks feed it to `sh -eu -s`;
                            webhook-script uses `sh -eu -c` so stdin remains available for webhook JSON.
                          minLength: 1
                          type: string
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds bounds the hook script; on expiry the harness SIGKILLs its process
                            group. Harness default is 120 when omitted.
                          format: int64
                          maximum: 3600
                          minimum: 1
                          type: integer
                      required:
                      - script
                      type: object
                    concurrency:
                      default: 1
                      format: int64
                      minimum: 1
                      type: integer
                    cron:
                      description: 'CronSpec configures a cron channel (config: channels[].cron).'
                      properties:
                        schedule:
                          type: string
                        timezone:
                          default: UTC
                          type: string
                      required:
                      - schedule
                      type: object
                    name:
                      minLength: 1
                      type: string
                    prepare:
                      description: |-
                        Prepare runs on the channel lane before the session engine is acquired or reused for
                        an invocation. It is fail-closed: a non-zero exit abandons the invocation, so nothing
                        is posted. It re-runs for every event on a session workspace that persists, so scripts
                        such as clone-or-fetch must be idempotent. Valid for every channel type.
                      properties:
                        forwardEnv:
                          description: |-
                            ForwardEnv selects names from the merged AgentProfile.spec.env + ACHAgent.spec.env.
                            Literal values become the hook's env; secretKeyRef values become its secretEnv via
                            generated Pod aliases. Unknown names are ignored and remain unset.
                          items:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        script:
                          description: |-
                            Script is the static /bin/sh program. Lifecycle hooks feed it to `sh -eu -s`;
                            webhook-script uses `sh -eu -c` so stdin remains available for webhook JSON.
                          minLength: 1
                          type: string
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds bounds the hook script; on expiry the harness SIGKILLs its process
                            group. Harness default is 120 when omitted.
                          format: int64
                          maximum: 3600
                          minimum: 1
                          type: integer
                      required:
                      - script
                      type: object
                    prompt:
                      type: string
                    queue:
                      description: 'QueueSpec configures a redis queue channel (config:
                        channels[].queue; type/ackMode are constants).'
                      properties:
                        key:
                          type: string
                      required:
                      - key
                      type: object
                    script:
                      description: |-
                        Script is the deterministic handler for type=webhook-script. The normalized webhook
                        JSON is passed on stdin; the harness never invokes the agent engine. Its workspace is
                        temporary and removed after each event.
                      properties:
                        forwardEnv:
                          description: |-
                            ForwardEnv selects names from the merged AgentProfile.spec.env + ACHAgent.spec.env.
                            Literal values become the hook's env; secretKeyRef values become its secretEnv via
                            generated Pod aliases. Unknown names are ignored and remain unset.
                          items:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        script:
                          description: |-
                            Script is the static /bin/sh program. Lifecycle hooks feed it to `sh -eu -s`;
                            webhook-script uses `sh -eu -c` so stdin remains available for webhook JSON.
                          minLength: 1
                          type: string
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds bounds the hook script; on expiry the harness SIGKILLs its process
                            group. Harness default is 120 when omitted.
                          format: int64
                          maximum: 3600
                          minimum: 1
                          type: integer
                      required:
                      - script
                      type: object
                    session:
                      description: |-
                        SessionSpec selects which opencode conversation a channel turn reuses and
                        bounds its growth (config: channels[].session). type is the discriminator;
                        key is the {{ }} template, valid ONLY when type==custom. Omitting the whole
                        block lets the harness apply its own default (type: none). This changes only
                        which session a turn reuses — the router lane key (event.session_key) is
                        unaffected.
                      properties:
                        key:
                          description: |-
                            Key is the {{ }} session template (payload.* / internal.*). REQUIRED iff
                            type==custom, FORBIDDEN otherwise. An empty render falls back to none + WARN.
                          type: string
                        maxTokens:
                          description: |-
                            MaxTokens caps growth: once the previous turn's input_tokens exceed it,
                            apply overflow (auto/custom only; ignored for none).
                          format: int64
                          minimum: 1
                          type: integer
                        overflow:
                          default: compact
                          description: |-
                            Overflow: compact summarizes the session in place; rotate starts a fresh
                            session and deletes the old one.
                          enum:
                          - compact
                          - rotate
                          type: string
                        type:
                          default: none
                          description: |-
                            none: fresh session per event, deleted post-turn. auto: reuse the
                            channel-derived session_key. custom: reuse the session named by key.
                          enum:
                          - auto
                          - none
                          - custom
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: session.key is required (non-empty) iff type is custom,
                          forbidden otherwise
                        rule: 'self.type != ''custom'' ? !has(self.key) : (has(self.key)
                          && size(self.key) > 0)'
                    source:
                      enum:
                      - gitlab
                      - github
                      - generic
                      type: string
                    type:
                      enum:
                      - webhook
                      - webhook-script
                      - cron
                      - queue
                      - a2a
                      type: string
                    webhook:
                      description: WebhookSpec configures webhook ingress for model
                        and deterministic-script channels.
                      properties:
                        auth:
                          description: 'WebhookAuthSpec configures webhook auth (config:
                            channels[].webhook.auth; secretRef → secretPath).'
                          properties:
                            header:
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            type:
                              enum:
                              - gitlab_token
                              - hmac
                              - header_token
                              - none
                              type: string
                          required:
                          - type
                          type: object
                          x-kubernetes-validations:
                          - message: webhook.auth.secretRef is required unless type=none
                            rule: self.type=='none' || has(self.secretRef)
                          - message: webhook.auth.header is required when type=header_token
                            rule: self.type!='header_token' || (has(self.header) &&
                              size(self.header)>0)
                        botUsername:
                          description: |-
                            BotUsername is the GitLab username the agent posts AS (the egress PAT's
                            user — a distinct fact from the agent name). When set, the harness drops
                            inbound events authored by this user plus gitlab-generated system notes
                            pre-enqueue (loop-guard). Omit → guard off. gitlab source only; ignored
                            for github/generic. Rendered verbatim to channels[].webhook.botUsername.
                          type: string
                        gitlabEvents:
                          items:
                            enum:
                            - merge_request
                            - issue
                            - note
                            - push
                            - project_create
                            - project_rename
                            - project_transfer
                            - project_update
                            - repository_update
                            type: string
                          type: array
                        triggerUsers:
                          description: |-
                            TriggerUsers is an actor allowlist: only these GitLab usernames may trigger
                            the handler. Omit → any author triggers. System events without a username are
                            rejected when this list is set, so webhook-script registrars should omit it.
                            GitLab source only; ignored for github/generic.
                          items:
                            type: string
                          type: array
                      required:
                      - auth
                      type: object
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: 'channels: the block matching type is required'
                    rule: ((self.type=='webhook' || self.type=='webhook-script') &&
                      has(self.webhook)) || (self.type=='cron' && has(self.cron))
                      || (self.type=='queue' && has(self.queue)) || (self.type=='a2a'
                      && has(self.a2a))
                  - message: channels.source is only valid for webhook channels
                    rule: self.type=='webhook' || self.type=='webhook-script' || !has(self.source)
                  - message: channels.script is required only for webhook-script
                    rule: 'self.type==''webhook-script'' ? has(self.script) : !has(self.script)'
                  - message: webhook-script forbids prompt, prepare, and cleanup
                    rule: self.type!='webhook-script' || (!has(self.prompt) && !has(self.prepare)
                      && !has(self.cleanup))
                  - message: channels.cleanup requires channels.prepare
                    rule: '!has(self.cleanup) || has(self.prepare)'
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              cost:
                description: |-
                  CostSpec selects where the per-invocation cost figure comes from (config: cost.source).
                  Free string ("engine"|"litellm_usage"|"litellm_headers"|"none"); the harness validates and
                  hard-fails on an unknown value. Omitted → harness default (engine, today's behavior).
                  litellm_usage prices per-response usage against LiteLLM's table via GET /v2/model/info;
                  litellm_headers reads x-litellm-response-cost and is non-streaming only. Requires an
                  ach-agent image >= v0.10.0.
                properties:
                  source:
                    type: string
                type: object
              engine:
                description: |-
                  EngineSpec is the harness-local engine block (config: engine.*). Unset fields are omitted
                  (the harness defaults them).
                properties:
                  forwardEnv:
                    items:
                      type: string
                    type: array
                  home:
                    type: string
                  idleTtlSeconds:
                    format: int64
                    minimum: 0
                    type: integer
                  maxToolCalls:
                    format: int64
                    minimum: 0
                    type: integer
                  pi:
                    description: Pi configures the Pi engine; consulted only when
                      Type == "pi".
                    properties:
                      binaryPath:
                        type: string
                      mcpAdapterPath:
                        type: string
                    type: object
                  startupTimeoutSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  type:
                    description: |-
                      Type selects the engine. Free string ("opencode"|"pi"); the harness validates and
                      hard-fails on an unknown value. Omitted → harness default (opencode).
                    type: string
                  workDir:
                    type: string
                type: object
              env:
                description: |-
                  Env are pod-level environment variables merged over AgentProfile.spec.env by name.
                  An agent entry replaces the complete inherited EnvVar. Reserved ACH_* names are
                  forbidden; only literal values and secretKeyRef sources are supported.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: env must not set reserved ACH_* vars
                  rule: self.all(e, !e.name.startsWith('ACH_'))
                - message: env valueFrom supports only secretKeyRef
                  rule: self.all(e, !has(e.valueFrom) || (has(e.valueFrom.secretKeyRef)
                    && !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef)
                    && !has(e.valueFrom.resourceFieldRef) && !has(e.valueFrom.fileKeyRef)))
                - message: env value and valueFrom are mutually exclusive
                  rule: self.all(e, !has(e.valueFrom) || !has(e.value) || e.value
                    == '')
              expose:
                description: |-
                  Expose controls reachability (Service + gateway route). Omit for a fully
                  private agent (no Service, no public URL).
                properties:
                  gateway:
                    description: |-
                      Gateway publishes the agent on the shared ACH gateway
                      (/agents/{ns}/{service} route + status.gatewayURL). Requires service.
                    type: boolean
                  service:
                    description: |-
                      Service creates the ClusterIP Service (achagent-<name>) so in-cluster
                      peers (a2a) or your own ingress can reach the harness. Required for any
                      inbound HTTP channel (webhook/a2a) to be reachable at all.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: expose.gateway requires expose.service
                  rule: '!self.gateway || self.service'
              health:
                description: |-
                  HealthSpec is the harness HTTP surface (config: health{host,port}). Also drives the
                  Service targetPort and the container probes. Harness default port is 8080.
                properties:
                  host:
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              identity:
                description: 'IdentitySpec carries the ACH ek_ (config: injected as
                  ACH_TOKEN env via secretKeyRef).'
                properties:
                  secretRef:
                    description: SecretRef points at a Secret holding the ek_ (create
                      it yourself, e.g. `ach-cli keys create`).
                    properties:
                      key:
                        description: Key is the data key inside the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Kubernetes Secret name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretRef
                type: object
              image:
                type: string
              limits:
                description: 'LimitsSpec bounds invocations (config: limits.*). Unset
                  → harness default.'
                properties:
                  idempotencyWindowSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxConcurrentInvocations:
                    format: int64
                    minimum: 1
                    type: integer
                  maxInvocationSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxQueuedTotal:
                    format: int64
                    minimum: 1
                    type: integer
                  maxSteps:
                    format: int64
                    minimum: 1
                    type: integer
                  terminalOutputRetries:
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              mcpServers:
                description: |-
                  MCPServers are harness-managed MCP servers (repoCheckout / local / remote)
                  rendered into the config's mcpServers map. Presence = enabled; omit for none.
                items:
                  description: |-
                    McpServerSpec is one harness-managed MCP server (rendered into config
                    mcpServers[<name>]). Discriminated by type: repoCheckout is HARNESS-HOSTED (the
                    harness runs a checkout_repo facade, injecting the agent's ek_); local/remote are
                    PASSTHROUGH (opencode launches a stdio subprocess / connects to a remote endpoint
                    directly, NOT via the ACH proxy). The operator renders the list into the config's
                    mcpServers map keyed by name. Distinct from the Environment's ACH-fronted MCP set
                    (hydrated as runtime.mcpServers) — different namespace, no collision.
                  properties:
                    local:
                      description: |-
                        LocalMcpSpec is a passthrough stdio MCP server opencode launches as a subprocess.
                        env lists extra var NAMES to forward to the subprocess (ACH_*/ek_ are stripped
                        defensively); wire their values into the pod via profile/agent spec.env.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                        command:
                          minLength: 1
                          type: string
                        env:
                          items:
                            type: string
                          type: array
