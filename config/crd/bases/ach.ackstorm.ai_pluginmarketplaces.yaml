                        minLength: 1
                        type: string
                      name:
                        description: Name of the Kubernetes Secret in the CR's namespace.
                        minLength: 1
                        type: string
                      secretAccessKeyKey:
                        description: |-
                          SecretAccessKeyKey is the data-key holding the AWS secret-access-key
