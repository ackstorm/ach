                        minLength: 1
                        type: string
                      name:
                        description: Name of the Kubernetes Secret in the CR's namespace.
                        minLength: 1
                        type: string
                      secretAccessKeyKey:
                        description: |-
                          SecretAccessKeyKey is the data-key holding the AWS secret-access-key
                          (S3 source only).
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  host:
                    description: Host of the GitLab instance. Defaults to gitlab.com
                      when empty.
                    type: string
                  path:
                    description: Path within the project repo.
                    type: string
                  project:
                    description: Project is the "<namespace>/<project>" GitLab identifier.
                    minLength: 1
                    type: string
                  ref:
                    description: Ref is a branch or tag name.
                    minLength: 1
                    type: string
                  transport:
