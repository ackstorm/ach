                          (S3 source only).
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  path:
                    description: Path within the repo.
                    type: string
                  ref:
                    description: Ref is a branch or tag name.
                    minLength: 1
                    type: string
                  repo:
                    description: Repo within the workspace.
                    minLength: 1
                    type: string
                  transport:
                    default: git
                    description: |-
                      Transport selects the wire protocol used to fetch from this upstream.

