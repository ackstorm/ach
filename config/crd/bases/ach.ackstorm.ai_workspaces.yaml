---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: workspaces.ach.ackstorm.ai
spec:
  group: ach.ackstorm.ai
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.conditions[?(@.type=='WorkloadApplied')].status
      name: Applied
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace requests a sleeping or active execution workload for
          one ACHAgent workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkspaceResourceSpec describes the identity and requested replica count of one
              per-agent execution Workspace. Execution configuration is resolved from the owning
              ACHAgent's current AgentProfile by the operator; this API deliberately carries no
              image, resource, profile, secret, storage, or routing-key material.
            properties:
              agentRef:
                description: AgentRef identifies the same-namespace ACHAgent by name
                  and immutable UID.
                properties:
                  name:
                    description: Name is resolved in the Workspace's namespace.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the canonical lowercase UID of the ACHAgent.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              expectedPodUID:
                description: ExpectedPodUID is an optional pod replacement precondition
                  used when scaling to zero.
                type: string
              expectedStatefulSetUID:
                description: |-
                  ExpectedStatefulSetUID is an optional precondition for operating on an existing
                  execution StatefulSet.
                type: string
              replicas:
                description: |-
                  Replicas is required and limited to sleeping (0) or active (1). It has no default,
                  so creating a Workspace cannot activate execution implicitly.
                format: int32
                maximum: 1
                minimum: 0
                type: integer
              workspaceRef:
                description: WorkspaceRef is the full lowercase SHA-256 digest of
                  this Workspace identity.
                pattern: ^[0-9a-f]{64}$
                type: string
            required:
            - agentRef
            - replicas
            - workspaceRef
            type: object
            x-kubernetes-validations:
            - message: agentRef is immutable
              rule: self.agentRef == oldSelf.agentRef
            - message: workspaceRef is immutable
              rule: self.workspaceRef == oldSelf.workspaceRef
          status:
            description: WorkspaceStatus records operator observations for one requested
              generation.
            properties:
              conditions:
                description: |-
                  Conditions use the standard Kubernetes condition shape. The operator publishes
                  OwnerResolved, WorkloadApplied, WorkloadReady, and UpdatePending conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the Workspace generation evaluated
                  by the operator.
                format: int64
                type: integer
              statefulSetUID:
                description: StatefulSetUID is the UID of the execution StatefulSet
                  observed for this Workspace.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
