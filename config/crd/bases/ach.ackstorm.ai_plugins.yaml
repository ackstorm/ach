                - gitlab
                - bitbucket
                - s3
                - gcs
                - http
                type: string
            required:
            - refresh
            - type
            type: object
          status:
            description: PluginStatus defines the observed state of Plugin.
            properties:
              conditions:
                description: |-
                  Conditions exposes SourceReachable (and, for PluginMarketplace,
                  Synced) per §6.6.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSuccessfulRefresh:
                description: |-
                  LastSuccessfulRefresh is the wall-clock time of the most recent
                  successful upstream fetch + atomic publish (§10.3 step 5).
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation of the CR the
                  reconciler most recently processed.
                format: int64
                type: integer
              storageLocation:
                description: |-
                  StorageLocation is the cached filesystem path the Content Service
                  serves from after the last successful refresh (§10.3). Empty until
                  the first successful refresh.
                type: string
              upstreamRev:
                description: |-
                  UpstreamRev is the per-source revision identifier the most recent
                  successful refresh recorded — for git sources this is the resolved
                  commit SHA; for S3 it is the object ETag; for GCS the object
                  generation; for HTTP a composite of ETag and Last-Modified
                  separated by a literal pipe. The Phase 2 reconciler reads this
                  value to pass as PriorRev on the next fetch for conditional-GET /
                  not-modified detection. Empty before the first successful refresh.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: Plugin.spec.refresh.maxStaleness is REQUIRED (CRD-04)
          rule: has(self.spec.refresh) && has(self.spec.refresh.maxStaleness)
        - message: Plugin.spec.refresh.interval must be <= refresh.maxStaleness (CRD-03)
          rule: '!has(self.spec.refresh.interval) || duration(self.spec.refresh.interval)
            <= duration(self.spec.refresh.maxStaleness)'
        - message: Plugin.spec must include the subobject matching spec.type (CRD-03)
          rule: (self.spec.type == 'github' && has(self.spec.github)) || (self.spec.type
            == 'gitlab' && has(self.spec.gitlab)) || (self.spec.type == 'bitbucket'
            && has(self.spec.bitbucket)) || (self.spec.type == 's3' && has(self.spec.s3))
            || (self.spec.type == 'gcs' && has(self.spec.gcs)) || (self.spec.type
            == 'http' && has(self.spec.http))
    served: true
    storage: true
    subresources:
      status: {}
