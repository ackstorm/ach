                            - bitbucket  → BITBUCKET_TOKEN
                          (Matches the ecosystem env-var convention used by gh, glab,
                          terraform-provider-*, gitlab-runner, etc.) Other source types
                          (s3 / gcs / http) carry their own per-type key fields and do
