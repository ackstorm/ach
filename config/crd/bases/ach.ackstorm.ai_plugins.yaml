                        minLength: 1
                        type: string
                      headerName:
                        description: |-
                          HeaderName is the HTTP header name to attach for http sources
                          (e.g. "Authorization").
                        minLength: 1
                        type: string
                      headerValueKey:
                        description: |-
                          HeaderValueKey is the data-key holding the value for HeaderName
                          (http source only).
                        minLength: 1
                        type: string
                      key:
                        description: |-
                          Key is the name of the Secret data key holding the bearer token.
                          Optional; when omitted on a git source type the operator falls
                          back to a provider-specific default key name:
                            - github     → GITHUB_TOKEN
                            - gitlab     → GITLAB_TOKEN
                            - bitbucket  → BITBUCKET_TOKEN
                          (Matches the ecosystem env-var convention used by gh, glab,
                          terraform-provider-*, gitlab-runner, etc.) Other source types
                          (s3 / gcs / http) carry their own per-type key fields and do
                          NOT use this fallback.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Kubernetes Secret in the CR's namespace.
                        minLength: 1
                        type: string
                      secretAccessKeyKey:
                        description: |-
                          SecretAccessKeyKey is the data-key holding the AWS secret-access-key
                          (S3 source only).
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  host:
                    description: |-
                      Host of the GitLab instance. Accepts a bare host ("git.example.com")
                      or a full "https://git.example.com" form — the scheme is stripped and
                      the clone/REST URL is always built as https://<host>. Behaves
                      identically for every consumer (Artifact / Plugin / Prompt /
                      PluginMarketplace). Defaults to gitlab.com when empty.
                    type: string
                  path:
                    description: Path within the project repo.
                    type: string
                  project:
                    description: Project is the "<namespace>/<project>" GitLab identifier.
                    minLength: 1
                    type: string
                  ref:
                    description: Ref is a branch or tag name.
                    minLength: 1
                    type: string
                  transport:
                    default: git
                    description: |-
                      Transport selects the wire protocol used to fetch from this upstream.

                        "git"  — use git ls-remote + git clone (no per-IP REST rate-limit;
                                 recommended; default).
                        "rest" — use the provider's REST API. Subject to per-IP anonymous
                                 quotas (GitHub: 60/h; GitLab: 60/min; Bitbucket: 60/h).
                                 Retained as a one-release escape hatch; will be removed.
                    enum:
                    - git
                    - rest
                    type: string
                required:
                - project
                - ref
                type: object
              http:
                description: HTTP source. Required when spec.type == "http".
                properties:
                  authSecretRef:
                    description: |-
                      AuthSecretRef optionally attaches an authentication header
                      (e.g. Authorization: Bearer ...). The data key named via
                      .headerValueKey supplies the header value at request time.
                    properties:
                      accessKeyIdKey:
                        description: |-
                          AccessKeyIDKey is the data-key holding the AWS access-key-id
                          (S3 source only).
                        minLength: 1
                        type: string
                      headerName:
                        description: |-
                          HeaderName is the HTTP header name to attach for http sources
                          (e.g. "Authorization").
                        minLength: 1
                        type: string
                      headerValueKey:
                        description: |-
                          HeaderValueKey is the data-key holding the value for HeaderName
                          (http source only).
                        minLength: 1
                        type: string
                      key:
                        description: |-
                          Key is the name of the Secret data key holding the bearer token.
                          Optional; when omitted on a git source type the operator falls
                          back to a provider-specific default key name:
                            - github     → GITHUB_TOKEN
                            - gitlab     → GITLAB_TOKEN
                            - bitbucket  → BITBUCKET_TOKEN
                          (Matches the ecosystem env-var convention used by gh, glab,
                          terraform-provider-*, gitlab-runner, etc.) Other source types
                          (s3 / gcs / http) carry their own per-type key fields and do
                          NOT use this fallback.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Kubernetes Secret in the CR's namespace.
                        minLength: 1
                        type: string
                      secretAccessKeyKey:
                        description: |-
