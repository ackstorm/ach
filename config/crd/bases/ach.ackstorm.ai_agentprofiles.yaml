                    type: integer
                  maxConcurrentInvocations:
                    format: int64
                    minimum: 1
                    type: integer
                  maxInvocationSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxQueuedTotal:
                    format: int64
                    minimum: 1
                    type: integer
                  maxSteps:
                    format: int64
                    minimum: 1
                    type: integer
                  terminalOutputRetries:
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              model:
                description: 'ModelSpec selects the ACH-served model (config: model{name,type,params}).'
