apiVersion: ach.ackstorm.ai/v1alpha1
kind: Plugin
metadata:
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
  name: example-plugin
  namespace: ach-system
spec:
  type: github
  github:
    repo: ackstorm/ach-example-plugin
    ref: main
    authSecretRef:
      name: github-readonly
      key: access-key
  refresh:
    interval: 1h
    maxStaleness: 24h
