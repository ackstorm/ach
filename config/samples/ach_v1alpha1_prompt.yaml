apiVersion: ach.ackstorm.ai/v1alpha1
kind: Prompt
metadata:
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
  name: example-prompt
  namespace: ach-system
spec:
  type: github
  github:
    repo: ackstorm/ach-prompts
    path: prompts/code-reviewer.md
    ref: main
    authSecretRef:
      name: github-readonly
      key: access-key
  refresh:
    interval: 15m
    maxStaleness: 24h
  contentType: text/markdown
