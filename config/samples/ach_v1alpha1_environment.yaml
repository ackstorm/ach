apiVersion: ach.ackstorm.ai/v1alpha1
kind: Environment
metadata:
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
  name: example
  namespace: ach-system
spec:
  authorizedTeams:
    - default
  notice: |
    This environment works best with the openai-* models.
    Remember to re-login after rotating your keys.
  description: "Example environment for the kustomize sample."
  runtime:
    models: []
    mcpServers: []
    a2aAgents: []
    # Guardrail names LiteLLM runs on this Environment's ek_ traffic. What each
    # one covers depends on ITS mode: a pre_call guardrail inspects completions
    # and does not run on /mcp — see `ach-cli runtime guardrails`.
    # Requires a LiteLLM Enterprise licence. Names must already exist on the
    # proxy: an unknown name blocks NEW ek_ minting (503 not_ready) rather
    # than failing open — but it does not stop existing keys.
    # guardrails:
    #   - credential-filter
  context:
    prompts: []
    plugins: []
    artifacts: []
