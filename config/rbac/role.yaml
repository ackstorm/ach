---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ach-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - artifacts
  - backendidentitypolicies
  - environments
  - litellmconnections
  - pluginmarketplaces
  - plugins
  - prompts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - artifacts/finalizers
  - backendidentitypolicies/finalizers
  - environments/finalizers
  - litellmconnections/finalizers
  - pluginmarketplaces/finalizers
  - plugins/finalizers
  - prompts/finalizers
  verbs:
  - update
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - artifacts/status
  - backendidentitypolicies/status
  - environments/status
  - litellmconnections/status
  - pluginmarketplaces/status
  - plugins/status
  - prompts/status
  verbs:
  - get
  - patch
  - update
