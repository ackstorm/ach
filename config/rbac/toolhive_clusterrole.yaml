# ToolHive cluster-scoped read RBAC.
#
# Grants the operator's ServiceAccount read access to ToolHive's
# `toolhive.stacklok.dev/v1beta1` MCPServer + VirtualMCPServer custom
# resources at cluster scope. The cluster-scope grant is intentional:
# discovery CRs may select ToolHive objects from ANY namespace, and the
# spec's dotted-naming guarantee requires cross-namespace observability.
#
# This file ships UNCONDITIONALLY: deployments that never instantiate
# a MCPServer-discovery CR still carry the unused permission. Blast
# radius is low — ToolHive objects do not carry secret material
# (status.url is the only sensitive field, and it is published by the
# ToolHive deployment by design).
#
# The ClusterRoleBinding subject `name` MUST match the actual operator
# ServiceAccount name. ACH's SA is named explicitly `ach` in
# config/rbac/service_account.yaml; this binding references it by the
# same literal.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ach-toolhive-reader
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - toolhive.stacklok.dev
  resources:
  - mcpservers
  - virtualmcpservers
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ach-toolhive-reader
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ach-toolhive-reader
subjects:
- kind: ServiceAccount
  name: ach
  # Namespace gets resolved by kustomize at the overlay layer.
  namespace: system
