# gitleaks v8 config — extends the default ruleset with project-scoped
# allowlists for synthetic test fixtures and vendored upstream sample tokens.
#
# Surgical scope: the allowlists below cover the exact sample / fixture
# strings that appear in this repo. Any real-looking secret value WILL
# still trigger gitleaks regardless of file path.

[extend]
useDefault = true

# Allowlist 1 — fixture / sample token values that appear in tests, docs,
# and the vendored LiteLLM OpenAPI spec.
# `regexTarget = "match"` evaluates against the gitleaks-detected match
# (which includes the secret value), so the strings below catch every
# occurrence of these literal tokens regardless of file path.
[[allowlists]]
description = "Project fixtures + upstream LiteLLM sample tokens"
regexTarget = "match"
regexes = [
    '''sk-1234''',
    '''sk-test-master-key''',
    '''sk-wrong-key-tier2''',
    '''sk-canary-MODEL-LEAK-[0-9]+''',
]

# Allowlist 2 — ACH synthetic fixtures in *_test.go files where the
# secret value contains an obvious "this is fake" marker
# (test|canary|example|synthetic|fake|dummy). Real-looking secrets in
# test files still fail the check.
#
# ACH does NOT bundle the upstream LiteLLM OpenAPI spec (alitellm did,
# under spec/litellm_api.json), so that allowlist is dropped here.
[[allowlists]]
description = "ACH synthetic test fixtures"
condition   = "AND"
paths = [
    '''.*_test\.go$''',
]
regexTarget = "match"
regexes = [
    '''(?i)(test|canary|example|synthetic|fake|dummy)''',
]

# Allowlist 3 — local Go module cache (.gocache/) and vendor/ are
# build-time artifacts (gitignored), never committed. With --no-git
# scans, gitleaks does not consult .gitignore, so explicitly skip them
# to avoid flagging upstream testdata fixtures (gosec, prometheus,
# zxcvbn-go test keys, etc.). Git-aware scans (the actual pre-push
# gate) ignore .gocache/ via .gitignore and never hit these paths.
[[allowlists]]
description = "Build-time caches (.gocache/, vendor/) — gitignored"
paths = [
    '''(^|/)\.gocache/''',
    '''(^|/)vendor/''',
]
