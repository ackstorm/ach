version: 2

project_name: ach

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: ach
    main: ./cmd/ach
    binary: ach
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ackstorm/ach/cmd/ach/cmd.Version={{.Version}}
  - id: ach-cli
    main: ./cmd/ach-cli
    binary: ach-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ackstorm/ach/cmd/ach-cli/cmd.Version={{.Version}}

archives:
  - id: binaries
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    ids:
      - ach
  - id: cli-binaries
    name_template: "ach-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    ids:
      - ach-cli
  - id: source
    name_template: "{{ .ProjectName }}_{{ .Version }}_source"
    meta: true
    files:
      - cmd/
      - api/
      - internal/
      - config/
      - docs/
      - test/
      - Makefile
      - Dockerfile
      - README.md
      - LICENSE
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - MAINTAINERS.md
      - PROJECT
      - ROADMAP.md
      - .goreleaser.yml

dockers:
  - id: ach-amd64
    ids: [ach]
    image_templates:
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - db/migrations
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
  - id: ach-arm64
    ids: [ach]
    image_templates:
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - db/migrations
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"

docker_manifests:
  - name_template: "ghcr.io/ackstorm/ach:v{{ .Version }}"
    image_templates:
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-amd64"
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-arm64"
  - name_template: "ghcr.io/ackstorm/ach:latest"
    image_templates:
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-amd64"
      - "ghcr.io/ackstorm/ach:v{{ .Version }}-arm64"
    skip_push: "{{ if .Prerelease }}true{{ else }}false{{ end }}"

checksum:
  name_template: 'checksums.txt'

# HRD-09: CycloneDX SBOM via goreleaser's native sboms block. Generated
# after artifacts are built so dist/ is in the state goreleaser expects.
# cyclonedx-gomod must be on PATH; release.yml installs it via go install.
sboms:
  - id: ach
    cmd: cyclonedx-gomod
    args: ["app", "-main", "cmd/ach", "-licenses", "-json", "-output", "$document", "."]
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.cyclonedx.json"
    artifacts: source
  - id: ach-cli
    cmd: cyclonedx-gomod
    args: ["app", "-main", "cmd/ach-cli", "-licenses", "-json", "-output", "$document", "."]
    documents:
      - "ach-cli_{{ .Version }}_sbom.cyclonedx.json"
    artifacts: source

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - '^chore(\([[:word:]]+\))?:'
      - "^ci:"
      - "^Automated update to"
      - "^Merge pull request #"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .ProjectName }}"
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## ach {{.Version}}

    ### Container Images

    - `ghcr.io/ackstorm/ach:v{{ .Version }}`
    - `ghcr.io/ackstorm/ach:latest`

    ### Installation

    #### Using Helm (Recommended)

    ```bash
    helm install ach oci://ghcr.io/ackstorm/charts/ach --version {{ .Version }}
    ```

    #### Using kubectl

    ```bash
    # Install CRDs using kustomize
    kubectl apply -k https://github.com/ackstorm/ach/config/crd

    # Install the operator using kustomize
    kubectl apply -k https://github.com/ackstorm/ach/config/default
    ```

# HRD-09: Cosign keyless OIDC signatures for checksums + container images.
# Requires id-token: write in the workflow + cosign on PATH (release.yml
# installs via sigstore/cosign-installer).
signs:
  - id: checksums
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum
    output: true

docker_signs:
  - id: images
    cmd: cosign
    args:
      - sign
      - --yes
      - ${artifact}
    artifacts: all
    output: true
