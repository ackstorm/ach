# Phase 02.1 e2e fixture — PluginMarketplace CR for SC3_AlphabeticalConflict.
#
# beta-mkt is the alphabetical loser ("beta-mkt" > "alpha-mkt"); when
# applied alongside alpha-mkt, it should end up with Synced=False
# reason=NameConflict because both marketplaces claim shared-plugin-name.
#
# References the SAME fixture-server URL as alpha-mkt — both marketplaces
# see the same upstream catalog, simplifying the conflict invariant.
---
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: beta-mkt
  namespace: ach-system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
    ach.ackstorm.ai/e2e: phase2-sc3
spec:
  type: http
  http:
    url: http://marketplace-fixture.ach-system.svc.cluster.local/marketplace.json
  refresh:
    maxStaleness: 1h
