# Phase 02.1 e2e fixture — Plugin CR for SC4_SizeCap.
#
# Points at sc4-too-large.tar.gz (~2 MiB, generated by the fixture-server
# initContainer). The SC4 test kubectl-set-envs the operator to
# ACH_PLUGIN_MAX_SIZE_MIB=1, waits for the new Pod, then applies this CR.
# The operator's io.LimitReader trips at Cap+1 bytes, unlinks the staging
# file, and emits SourceReachable=False reason=PluginTooLarge.
---
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Plugin
metadata:
  name: e2e-plugin-sc4-too-large
  namespace: ach-system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
    ach.ackstorm.ai/e2e: phase2-sc4
spec:
  type: http
  http:
    url: http://marketplace-fixture.ach-system.svc.cluster.local/sc4-too-large.tar.gz
  refresh:
    maxStaleness: 1h
