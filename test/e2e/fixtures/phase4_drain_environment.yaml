# Throwaway Environment for the §11f finalizer-drain e2e test ONLY.
#
# A copy of test/e2e/cluster/05-environment/demo.yaml renamed to demo-drain so
# the drain test (apply → assert resolved → delete → assert finalizer drains)
# never mutates the SYNCED "demo" Environment that other specs assert against.
# The execution resources it references (caveman / claude-code-system-prompt /
# openclaw-templates + the LiteLLM-seeded models/mcp/agents/team) are pre-synced
# by cluster.sh (stage 04 + reconcile_litellm), so this only adds + removes the
# Environment itself.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Environment
metadata:
  name: demo-drain
  namespace: ach-system
spec:
  authorizedTeams:
    - default
  runtime:
    models:
      - demo-model
    mcpServers:
      - demo-mcp-jwt
      - demo-mcp-nojwt
    a2aAgents:
      - demo-agent
  context:
    prompts:
      - claude-code-system-prompt
    plugins:
      - caveman
    artifacts:
      - openclaw-templates
