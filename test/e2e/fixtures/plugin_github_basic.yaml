# Phase 02.1 e2e fixture — Plugin CR for SC1_PluginPublish.
#
# Demonstrates the anonymous-github capability landed in Task 5b: the CR
# has NO `authSecretRef` block, so the operator's github fetcher issues
# unauthenticated GitHub API calls against the public repo and downloads
# the source tarball. octocat/Hello-World is GitHub's canonical tiny test
# repo (5-line README, ~150 bytes of tarball) — well under any plausible
# size cap. The `master` ref is stable; GitHub keeps this repo
# indefinitely for documentation examples.
#
# Schema/URL validated against current api/ach/v1alpha1/plugin_types.go.
---
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Plugin
metadata:
  name: e2e-plugin-sc1
  namespace: ach-system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/managed-by: kustomize
    ach.ackstorm.ai/e2e: phase2-sc1
spec:
  type: github
  github:
    repo: octocat/Hello-World
    ref: master
    # authSecretRef intentionally omitted — anonymous fetch via the
    # GitHub public-repo API (60 req/hour-per-IP rate limit ceiling).
  refresh:
    maxStaleness: 1h
