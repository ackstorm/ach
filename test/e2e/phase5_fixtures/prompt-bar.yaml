# SPDX-License-Identifier: Apache-2.0
#
# Phase 5 E2E fixture — Prompt "bar" serves a text/markdown file
# verbatim. Used by SC#1 (Content-Type assertion) and SC#2 error-
# matrix subtests.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Prompt
metadata:
  name: bar
  namespace: ach-system
spec:
  type: github
  contentType: text/markdown
  refresh:
    interval: 6h
    maxStaleness: 24h
  github:
    repo: asgeirtj/system_prompts_leaks
    ref: main
    path: Anthropic/claude-code.md
