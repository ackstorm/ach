#
# Phase 5 E2E fixture — Artifact "baz" with scope=object (single-file
# verbatim delivery). Exercises the CS handler's object-scope path,
# distinct from the directory-scope tar.gz path used by other fixtures.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Artifact
metadata:
  name: baz
  namespace: ach-system
spec:
  type: github
  scope: object
  refresh:
    interval: 6h
    maxStaleness: 24h
  github:
    repo: asgeirtj/system_prompts_leaks
    ref: main
    path: Anthropic/claude-code.md
