# Prompt pointing at a third-party repo (public, no GitHub PAT) and a nested
# file path. It has no content gate: the file is far above the Instruction limit.
#
# The Content Service serves it at /content/prompt/claude-code-system-prompt
# as a one-entry tar.gz (application/gzip).
#
# The source is a third-party repo pinned to a commit; the tests only need a
# fetchable file, the content is not asserted.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Prompt
metadata:
  name: claude-code-system-prompt
  namespace: ach-system
spec:
  type: github
  contentType: text/markdown
  refresh:
    interval: 6h
    maxStaleness: 24h
  github:
    repo: asgeirtj/system_prompts_leaks
    ref: main
    commit: 74761cc521a4ea73a603b54e7465e057de8ced19
    path: Anthropic/claude-opus-4.8.md
