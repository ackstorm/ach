apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 04 — all non-Environment ACH objects, applied post-ach (CRDs exist),
# pre-Environment (Environments in 05 reference these by name). Sources are the
# real upstreams (option B); each CR pins refresh.interval=1h so steady-state
# stays under any anonymous GitHub quota (default git transport, no REST limit).
resources:
  # LiteLLMConnection/default is no longer a stage-04 fixture — the ach chart
  # (stage 02) renders it from the litellmConnection values block. The operator
  # reconciles it; verify_all still gates on litellmconnection/default Ready.
  - marketplace-anthropic.yaml
  - marketplace-caveman.yaml
  # Phase 02 SC#3 same-plugin-name pair — both point at the real
  # anthropic catalogue filtered to `feature-dev`; under the scoped grammar
  # both settle Synced=True (feature-dev@conflict-mkt-a and
  # feature-dev@conflict-mkt-b are independent scoped references).
  - marketplace-conflict-a.yaml
  - marketplace-conflict-b.yaml
  - plugin-caveman.yaml
  - prompt-claude-code.yaml
  - artifact-openclaw.yaml
  - bip-context7.yaml
  - bip-duplicate.yaml
  - bip-demo-mcp-jwt.yaml
  - bip-demo-mcp-nojwt.yaml
  # Phase 5 content-service exercise matrix — valid + invalid of each CR
  # kind (referenced by Environment env-valid in stage 05). The e2e suite
  # asserts against these; it no longer applies its own copies. The
  # *-invalid fixtures settle at SourceReachable=False (negative path).
  - plugin-valid.yaml
  - plugin-invalid.yaml
  - prompt-valid.yaml
  - prompt-invalid.yaml
  - artifact-valid.yaml
  - artifact-invalid.yaml
