apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 04 — all non-Environment ACH objects, applied post-ach (CRDs exist),
# pre-Environment (Environments in 05 reference these by name). Sources are the
# real upstreams (option B); each CR pins refresh.interval=1h so steady-state
# stays reconcile-light (git is the only fetch transport; no per-IP REST quota
# applies).
resources:
  # LiteLLMConnection/default is no longer a stage-04 fixture — the ach chart
  # (stage 02) renders it from the litellmConnection values block. The operator
  # reconciles it; verify_all still gates on litellmconnection/default Ready.
  #
  # Plugin / PluginMarketplace fixtures are no longer applied: the Plugin and
  # PluginMarketplace kinds are disabled behind featuregate.PluginsEnabled=false
  # and their CRDs are not shipped in the Helm chart, so applying them here would
  # fail `no matches for kind`. Reconciler logic stays covered by envtest.
  # SkillMarketplace (anthropics/skills, path=skills) — convention discovery,
  # no marketplace.json. Demo references pdf@anthropic-skills.
  - skill-marketplace-anthropic.yaml
  # Standalone Skills pulled from the same monorepo via spec.github.path
  # (skills/pdf, skills/docx) — the no-marketplace skill resolution arm.
  - skill-pdf.yaml
  - skill-docx.yaml
  - prompt-claude-code.yaml
  - artifact-openclaw.yaml
  - bip-context7.yaml
  - bip-duplicate.yaml
  - bip-demo-mcp-jwt.yaml
  - bip-demo-mcp-nojwt.yaml
  # Phase 5 content-service exercise matrix — valid + invalid of prompt/artifact
  # (referenced by Environment env-valid in stage 05). The e2e suite asserts
  # against these; it no longer applies its own copies. The *-invalid fixtures
  # settle at SourceReachable=False (negative path).
  - prompt-valid.yaml
  - prompt-invalid.yaml
  - artifact-valid.yaml
  - artifact-invalid.yaml
