#
# PluginMarketplace — Phase 02 SC#3 (same plugin name under two marketplaces).
#
# conflict-mkt-a and conflict-mkt-b BOTH point at the real upstream
# anthropics/claude-plugins-official catalogue, filtered to the single
# `feature-dev` plugin. Under the marketplace-scoped plugin grammar
# (§12.3) the two entries are distinct: `feature-dev@conflict-mkt-a` and
# `feature-dev@conflict-mkt-b` are independent scoped references, so BOTH
# marketplaces settle Synced=True — there is no cross-marketplace name
# conflict when plugins are addressed by their (marketplace, name) pair.
#
# Why feature-dev: its source in the catalogue is `./plugins/feature-dev`
# (a same-repo subdir that ships `.claude-plugin/plugin.json`), so each
# marketplace materializes it reliably from the marketplace repo's own
# tarball and writes its marketplace_plugins row. feature-dev is NOT a
# `code-*` plugin (so it does not collide with the existing anthropic-code
# marketplace) and no Plugin CRD owns the name. The demo Environment fixture
# (05-environment/demo.yaml) references `feature-dev@conflict-mkt-a` to
# exercise the scoped resolution path end-to-end.
#
# refresh.interval is deliberately short (1m): quick re-reconcile so both
# marketplaces converge to Synced=True well inside cluster.sh verify_all's
# 300s budget.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: conflict-mkt-a
  namespace: ach-system
spec:
  type: github
  github:
    repo: anthropics/claude-plugins-official
    ref: main
  refresh:
    interval: 1m
    maxStaleness: 24h
  filters:
    include:
      - "^feature-dev$"
