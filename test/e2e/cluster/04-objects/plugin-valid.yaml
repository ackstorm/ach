# SPDX-License-Identifier: Apache-2.0
#
# Phase 5 content-service exercise — VALID plugin. Pulls a small public
# repo; the operator's §10.3 cache-refresh loop writes plugin/plugin-valid.tar.gz
# under the operator cache PVC and the content-service serves
# /content/plugin/plugin-valid from the projection row. Part of the SYNCED
# set (cluster.sh applies it at bring-up; verify_all gates it
# SourceReachable=True); the e2e suite asserts against it rather than
# applying its own copy. §12.3 precedence lock-in: this CRD-row branch wins
# over any marketplace_plugins row with the same name.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Plugin
metadata:
  name: plugin-valid
  namespace: ach-system
spec:
  type: github
  refresh:
    interval: 1h
    maxStaleness: 24h
  github:
    repo: JuliusBrussee/caveman
    ref: main
