# SPDX-License-Identifier: Apache-2.0
#
# PluginMarketplace — Phase 02 SC#3 (same plugin name under two marketplaces).
#
# Identical spec to conflict-mkt-a (same repo, same `^feature-dev$` filter),
# differing only in metadata.name. Under the marketplace-scoped plugin grammar
# both marketplaces settle Synced=True: `feature-dev@conflict-mkt-b` is an
# independent scoped reference distinct from `feature-dev@conflict-mkt-a`.
# There is no cross-marketplace name conflict.
#
# See marketplace-conflict-a.yaml for the full rationale (why feature-dev,
# why the short refresh.interval).
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: conflict-mkt-b
  namespace: ach-system
spec:
  type: github
  github:
    repo: anthropics/claude-plugins-official
    ref: main
  refresh:
    interval: 1m
    maxStaleness: 24h
  filters:
    include:
      - "^feature-dev$"
