# SPDX-License-Identifier: Apache-2.0
#
# PluginMarketplace — Phase 02 SC#3 (alphabetical name-conflict) LOSER.
#
# Identical spec to conflict-mkt-a (same repo, same `^feature-dev$` filter),
# differing only in metadata.name. Because "conflict-mkt-b" sorts AFTER
# "conflict-mkt-a", the §12.3 alphabetical rule makes this CR the loser:
# the feature-dev candidate it would otherwise materialize is dropped, the
# CR settles Synced=False reason=NameConflict, and status.plugins is zeroed.
#
# Excluded from the verify_all happy-state gate the same way the other
# negative fixtures (plugin-invalid, environment/demo-unresolved) are —
# verify_all instead asserts its EXPECTED failure state (Synced=False).
#
# See marketplace-conflict-a.yaml for the full rationale (why feature-dev,
# why the short refresh.interval).
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: conflict-mkt-b
  namespace: ach-system
spec:
  type: github
  github:
    repo: anthropics/claude-plugins-official
    ref: main
  refresh:
    interval: 1m
    maxStaleness: 24h
  filters:
    include:
      - "^feature-dev$"
