# PluginMarketplace — pulls anthropic/claude-plugins-official, the
# upstream Anthropic-curated catalogue. The operator fetches the repo
# tarball, extracts `.claude-plugin/marketplace.json`, applies the
# include/exclude RE2 filters below, and upserts one
# `marketplace_plugins` row per surviving entry.
#
# Source type is `github` (mirrors Plugin/Artifact). The marketplace
# controller's stage-1 body-reshape (pluginmarketplace_controller.go
# §219-235) detects tarball sources (github/gitlab/bitbucket) and
# extracts `<root>/.claude-plugin/marketplace.json` before parsing.
#
# Filters here pin the catalogue to only the `code-*` plugins (Claude
# Code-flavoured tooling). Drop or widen the include list to ingest the
# full catalogue.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: anthropic-code
  namespace: ach-system
spec:
  type: github
  github:
    repo: anthropics/claude-plugins-official
    ref: main
  refresh:
    interval: 1h
    maxStaleness: 24h
  filters:
    # Anchored RE2 — matches plugin names like `code-review`, `code-edit`,
    # etc. The leading `^` is implicit (CRD docs say anchored); the
    # explicit anchor here doubles as documentation.
    include:
      - "^code-.*"
