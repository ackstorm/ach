# The identity release — `profile: identity` — installed by scripts/cluster.sh
# reconcile_identity as Helm release `ach-identity` in namespace ach-identity,
# reachable as http://api.e2e.local:8080 (nginx shim server_name →
# ach-gateway.ach-identity). It fronts the SAME e2e LiteLLM with its own
# database (ach_identity on the shared Postgres), its own valkey keyspace
# (ACH_REDIS_DB=1), its own Dex client and its own signing key (minted by the
# forwarder). No CRDs (installCRDs=false is passed by cluster.sh), no operator.
# TestIdentityProfile covers it.
profile: identity

extraEnv:
  - name: ACH_DB_URL
    valueFrom:
      secretKeyRef:
        name: ach-db-url
        key: url
  - name: ACH_BASE_URL
    value: "http://api.e2e.local:8080"
  - name: ACH_DEX_ISSUER_URL
    value: "http://dex.dex-system.svc.cluster.local:5556/dex"
  - name: ACH_DEX_CLIENT_ID
    value: "ach-identity"
  - name: ACH_DEX_CLIENT_SECRET
    value: "dev-secret-not-for-prod"
  - name: ACH_DEX_REDIRECT_URL
    value: "http://api.e2e.local:8080/platform/auth/sso/callback"
  - name: ACH_REDIS_ADDR
    value: "valkey-primary.ach-system.svc.cluster.local:6379"
  - name: ACH_REDIS_DB
    value: "1"

litellmConnection:
  endpoint: http://litellm.litellm-system.svc.cluster.local:4000
  masterKeySecretRef:
    name: litellm-master-key
    key: masterKey

forwarder:
  headers:
    - {name: x-ach-key, mode: resolve}
    - {name: x-genai-api-key, mode: passthrough}

platformApi:
  admins:
    - kilgore@kilgore.trout
