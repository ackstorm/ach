events {}
http {
    # Stream-friendly defaults so SSE (/v1, /v2 streams) and streamable-http
    # MCP responses flush through to the client. The real routing now
    # lives in the ach-gateway pod; this nginx is an e2e-only shim that
    # adds the two dev kludges (/dex, /metrics/<svc>) on top and falls
    # through everything else to ach-gateway — preserving the single
    # ach.e2e.local:8080 origin the SSO cookie + metrics harness depend on.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 32m;

    # nginx DROPS any header whose name contains an underscore unless this is on
    # — silently, with no log line. The ach-agent harness correlates a Langfuse
    # session with `langfuse_session_id` (the only session mechanism LiteLLM
    # honours on the /gemini passthrough as well as /v1), so without this the
    # shim makes correlation look broken in dev/e2e while prod — fronted by
    # Istio/Envoy, which passes underscores — is fine. A prod-only bug in
    # reverse: the SHIM is what would be wrong.
    underscores_in_headers on;

    # api.e2e.local — the identity release (profile: identity, namespace
    # ach-identity): its own gateway, its own AS. /dex is the same dev
    # kludge as below (the browser round-trips Dex through this origin).
    server {
        listen 8080;
        server_name api.e2e.local;
        location /dex/ {
            proxy_pass http://dex.dex-system.svc.cluster.local:5556/dex/;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://ach-gateway.ach-identity.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8080 default_server;
        server_name ach.e2e.local;

        # Shim health — local 200, no upstream. Backs the pod probes
        # so `make wait-ach` reports the shim Ready once nginx serves.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Dex OIDC SSO — DEV KLUDGE. Prod reaches Dex directly via
        # ACH_DEX_ISSUER_URL; kind has one host port, so the rewritten
        # issuer is ach.e2e.local:8080/dex and the browser round-trips here.
        # The ach-gateway has NO /dex route by design.
        location /dex/ {
            proxy_pass http://dex.dex-system.svc.cluster.local:5556/dex/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Per-service /metrics scrape routes — DEV KLUDGE. Each service
        # exposes UNAUTHENTICATED /metrics on its traffic port; the e2e
        # harness reads ACH_{FORWARDER,CONTENT,PLATFORM,OPERATOR}_METRICS_URL
        # (= ach.e2e.local:8080/metrics/<svc>). The ach-gateway has NO /metrics
        # route by design — these MUST NOT be replicated in prod routing.
        location /metrics/forwarder { proxy_pass http://ach-forwarder.ach-system.svc.cluster.local:80/metrics; }
        location /metrics/content   { proxy_pass http://ach-content-service.ach-system.svc.cluster.local:8082/metrics; }
        location /metrics/platform  { proxy_pass http://ach-platform-api.ach-system.svc.cluster.local:80/metrics; }
        location /metrics/operator  { proxy_pass http://ach-operator-metrics.ach-system.svc.cluster.local:8080/metrics; }

        # ach-mock-broker (mcp-oauth stand-in) under a path — DEV KLUDGE. The
        # OAuth broker chain e2e must walk every hop through this single
        # ach.e2e.local:8080 origin (followToLoopback rewrites every redirect
        # authority to it), so the broker is exposed here instead of its own
        # Service DNS. The ach-gateway has NO /mock-broker route by design.
        location /mock-broker/ {
            proxy_pass http://ach-mock-broker.ach-system.svc/;
        }
        location = /.well-known/oauth-authorization-server/mock-broker {
            proxy_pass http://ach-mock-broker.ach-system.svc/metadata;
        }

        # Everything else (/platform, /content, /v1, /v2, /gemini, /mcp, /a2a,
        # /.well-known) -> the ach-gateway edge proxy, which owns routing.
        # This is the path prod traffic takes (ingress -> ach-gateway);
        # here nginx stands in for the ingress + the two kludges above.
        location / {
            proxy_pass http://ach-gateway.ach-system.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
