apiVersion: v1
kind: ConfigMap
metadata:
  name: ach-local-gateway-config
  namespace: ach-system
data:
  nginx.conf: |
    events {}
    http {
        # Stream-friendly defaults so SSE (/v1 stream) and streamable-http
        # MCP responses flush through to the client. The real routing now
        # lives in the ach-gateway pod; this nginx is an e2e-only shim that
        # adds the two dev kludges (/dex, /metrics/<svc>) on top and falls
        # through everything else to ach-gateway — preserving the single
        # localhost:8080 origin the SSO cookie + metrics harness depend on.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 32m;

        server {
            listen 8080;

            # Shim health — local 200, no upstream. Backs the pod probes
            # so `make wait-ach` reports the shim Ready once nginx serves.
            location = /healthz {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            # Dex OIDC SSO — DEV KLUDGE. Prod reaches Dex directly via
            # ACH_DEX_ISSUER_URL; kind has one host port, so the rewritten
            # issuer is localhost:8080/dex and the browser round-trips here.
            # The ach-gateway has NO /dex route by design.
            location /dex/ {
                proxy_pass http://dex.dex-system.svc.cluster.local:5556/dex/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            # Per-service /metrics scrape routes — DEV KLUDGE. Each service
            # exposes UNAUTHENTICATED /metrics on its traffic port; the e2e
            # harness reads ACH_{FORWARDER,CONTENT,PLATFORM,OPERATOR}_METRICS_URL
            # (= localhost:8080/metrics/<svc>). The ach-gateway has NO /metrics
            # route by design — these MUST NOT be replicated in prod routing.
            location /metrics/forwarder { proxy_pass http://ach-forwarder.ach-system.svc.cluster.local:80/metrics; }
            location /metrics/content   { proxy_pass http://ach-content-service.ach-system.svc.cluster.local:8082/metrics; }
            location /metrics/platform  { proxy_pass http://ach-platform-api.ach-system.svc.cluster.local:80/metrics; }
            location /metrics/operator  { proxy_pass http://ach-operator-metrics.ach-system.svc.cluster.local:8080/metrics; }

            # Everything else (/platform, /content, /v1, /gemini, /mcp, /a2a,
            # /.well-known) -> the ach-gateway edge proxy, which owns routing.
            # This is the path prod traffic takes (ingress -> ach-gateway);
            # here nginx stands in for the ingress + the two kludges above.
            location / {
                proxy_pass http://ach-gateway.ach-system.svc.cluster.local:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-local-gateway
  namespace: ach-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ach-local-gateway
  template:
    metadata:
      labels:
        app: ach-local-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        # Probes hit the local /healthz return-200 (no upstream dependency),
        # so the gateway is only marked Ready when nginx is serving config.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ach-local-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: ach-local-gateway
  namespace: ach-system
spec:
  # NodePort so the gateway is reachable from the host without a manual
  # `kubectl port-forward`. Paired with scripts/kind-config.yaml's
  # extraPortMapping (hostPort 8080 -> containerPort 30080), host
  # http://localhost:8080 routes straight to this gateway. NOTE: the
  # extraPortMapping only takes effect on `kind create` — an already-up
  # cluster must be recreated (cluster-down && cluster-up) to publish it.
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: ach-local-gateway
