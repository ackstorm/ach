# The nginx.conf ConfigMap is generated by kustomize (configMapGenerator in
# kustomization.yaml) with a content-hash name suffix, so any edit to
# files/nginx.conf yields a NEW ConfigMap name and kustomize rewrites this
# Deployment's volume reference — rolling the nginx pod automatically on
# `kubectl apply -k`. (A plain inline ConfigMap does NOT roll the pod on
# change: nginx loads its config once at startup, so a stale config would
# silently keep serving — see the gateway-mode cluster-sync gotcha.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-local-gateway
  namespace: ach-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ach-local-gateway
  template:
    metadata:
      labels:
        app: ach-local-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        # Probes hit the local /healthz return-200 (no upstream dependency),
        # so the gateway is only marked Ready when nginx is serving config.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ach-local-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: ach-local-gateway
  namespace: ach-system
spec:
  # NodePort so the gateway is reachable from the host without a manual
  # `kubectl port-forward`. Paired with scripts/kind-config.yaml's
  # extraPortMapping (hostPort 8080 -> containerPort 30080), host
  # http://localhost:8080 routes straight to this gateway. NOTE: the
  # extraPortMapping only takes effect on `kind create` — an already-up
  # cluster must be recreated (cluster-down && cluster-up) to publish it.
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: ach-local-gateway
