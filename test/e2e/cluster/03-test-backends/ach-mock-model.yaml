# ach-mock-model — LiteLLM-shaped data-plane capture backend (Phase 4).
#
# Test-only scaffolding kept OUT of the user-facing Helm chart (the chart's
# templates/test-mocks.yaml was removed). This backend serves the LiteLLM
# /v1/* chat-completion shape and records the last request it received at
# /__capture/last (reset via /__capture/reset), which the e2e suite uses to
# assert the forwarder's ek_-driven request-body tag injection (FWD-06 / SC2).
#
# Built + kind-loaded as ach-mock:e2e by cluster.sh (make build-image-mock),
# then applied post-ach as a stage-03 test backend. The legacy ach-mock-mcp
# sibling (args ["mcp"]) was dropped — the e2e suite drives the real LiteLLM
# and the JWT-validating MCP path uses ach-mcp-echo instead.
apiVersion: v1
kind: Service
metadata:
  name: ach-mock-model
  namespace: ach-system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-model
spec:
  selector:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-model
  ports:
    - name: http
      port: 80
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-mock-model
  namespace: ach-system
  labels:
    app.kubernetes.io/name: ach
    app.kubernetes.io/component: mock-model
    test.ach.ackstorm.ai/phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ach
      app.kubernetes.io/component: mock-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ach
        app.kubernetes.io/component: mock-model
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: ach-mock:e2e
          imagePullPolicy: IfNotPresent
          args: ["model"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: MOCK_BIND_ADDRESS
              value: ":9090"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
