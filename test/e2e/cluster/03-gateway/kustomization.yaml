apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Post-ach declarative base: the local unified nginx gateway (dev/Kind only).
# Applied by `scripts/cluster.sh` (reconcile_fixtures) via `kubectl apply -k`
# AFTER reconcile_ach has helm-installed the ach Services. The nginx config
# uses STATIC proxy_pass hostnames (ach-platform-api/forwarder/content-service,
# dex), which nginx resolves at startup — so the Services MUST exist first or
# nginx CrashLoops with "host not found in upstream". Do not move this earlier.
resources:
  - ach-local-gateway.yaml
