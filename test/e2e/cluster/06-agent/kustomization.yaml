apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 06 — a minimal agent-runtime fixture: an AgentProfile + a cron-only
# ACHAgent (standalone) + the same agent with spec.placement=distributed
# (agent-dist.yaml, three-role pod shape) + their shared ek Secret. Applied after the CRDs (stage 02) exist. Order
# within the stage does not matter — the operator re-reconciles on the profile
# and secret watches until both resolve.
#
# Two evidence tracks, kept separate on purpose (ach-agent handoff 2026-09-15):
#   - rendering shape: scripts/cluster.sh stage 07 gates WorkloadApplied=True,
#     a schema-valid config.json, the ACH_TOKEN secretKeyRef, and the
#     standalone/distributed container matrix — no image needed.
#   - runtime readiness: test/e2e/agent_runtime_ready_test.go mints a real ek
#     for the demo Environment at test time, swaps it into e2e-agent-ek, and
#     requires WorkloadReady=True on BOTH agents (hydration + native config +
#     directory prep completed in the pod), then checks distributed isolation.
# The committed ek value is a placeholder; nothing bypasses hydration.
resources:
  - ek-secret.yaml
  - profile.yaml
  - agent.yaml
  - agent-dist.yaml
