# The ek_ the agent authenticates to ACH with (injected as ACH_TOKEN via
# secretKeyRef). A placeholder value is enough for the operator's IdentityResolved
# gate — the fixture asserts operator OUTPUT (config + workload), not a live
# hydration (see 06-agent DEFERRED note).
apiVersion: v1
kind: Secret
metadata:
  name: e2e-agent-ek
  namespace: ach-system
type: Opaque
stringData:
  ek: ek_e2e_placeholder
