# LiteLLM hub configuration for the ach e2e cluster.
#
# Used by:  scripts/cluster.sh hydrate_litellm
# Chart:    oci://docker.litellm.ai/berriai/litellm-helm  (upstream, OCI, BETA)
# Image:    v1.87.1 (bumped from v1.83.10-stable, 2026-06-10). v1.83.10's MCP
#           gateway rejected non-admin virtual keys on /mcp/<name> with an
#           admin-only-route exception; v1.87.1 is required so the forwarder's
#           per-user x-litellm-api-key (litellm_key_material) is accepted on the
#           MCP gateway. NOTE: litellm-database publishes a bare `v1.87.1` tag,
#           NOT a `-stable` variant — keep the suffix off.
#
# WARNING: the upstream litellm-helm chart is in BETA. When bumping
# `chartVersion`, re-run `make e2e-full` and inspect any failed scenarios
# for schema drift.
#
# NOTE on image.tag override: the chart's default image.tag tracks chart
# appVersion. Recent appVersions (e.g. main-1.86.1) do not have a
# corresponding tag published under ghcr.io/berriai/litellm-database,
# producing ImagePullBackOff. The override below pins to the last
# known-good tag matching the operator's binary target; do NOT drop it
# on chart bumps unless you have validated the new appVersion exists
# under both `litellm` and `litellm-database` variants.
#
# Apply changes:  scripts/cluster.sh hydrate

chartVersion: 1.84.0

image:
  repository: ghcr.io/berriai/litellm-database
  tag: v1.87.1
  # Override chart default `Always`: cluster.sh pre-pulls + kind-loads
  # this image into the node before `helm install`. With `Always`,
  # kubelet round-trips ghcr.io on every Pod start (and every
  # migrations Job retry on backoff) — a flaky pull stalls the PreSync
  # Job and leaves the DB schema unmigrated. IfNotPresent + pre-load
  # eliminates the round-trip entirely.
  pullPolicy: IfNotPresent

db:
  deployStandalone: true
  database: litellm
  username: litellm
  password: litellm

# Bitnami postgresql subchart override (mirrors top-level
# hydrate_postgres docker.io/bitnamilegacy redirect). Bitnami pruned
# pinned image tags from docker.io/bitnami/* AND public.ecr.aws/bitnami/*
# in 2025; the surviving source is docker.io/bitnamilegacy/*. Point the
# registry at docker.io and override image.repository to the
# bitnamilegacy/<name> path. `allowInsecureImages: true` is required
# because the legacy namespace lacks the upstream signature chain.
postgresql:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: litellm
    password: litellm
    database: litellm

# Bitnami redis subchart override (same workaround).
redis:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/redis

# Chart key is `masterkey` (lowercase, no camelCase). When this value is
# mistyped the chart silently auto-generates a random one and produces
# misleading 401 errors on /health probes. Must match the
# ACH_LITELLM_MASTER_KEY value set in cluster.sh hydrate_ach.
masterkey: sk-test-master-key

envVars:
  LITELLM_LOG: DEBUG
  # Custom auth for SSO and virtual key impersonation by our forwarder
  LITELLM_CUSTOM_AUTH: "auth_user_map.sso_key_swapper"
  # MCP server_name sanitization (FIX2.txt HIGH-1, 2026-05-22): pin the
  # separator the upstream LiteLLM v1.83.x validator uses so internal/
  # litellm's mcp.go server_name rewriter and the upstream agree.
  MCP_TOOL_PREFIX_SEPARATOR: "."
  # PreSync migration Job handles schema; runtime container must NOT
  # re-run them on every Pod start.
  DISABLE_SCHEMA_UPDATE: "true"
  # Required for POST /model/new — without it, LiteLLM returns 500 from
  # add_new_model.
  STORE_MODEL_IN_DB: "True"
  # Force prisma migration check to exit non-zero when Postgres isn't
  # ready, so the K8s Job backoff retries until the StatefulSet is up
  # (vs LiteLLM's internal "continuing startup" exit 0 silently bailing).
  ENFORCE_PRISMA_MIGRATION_CHECK: "true"

# Mount the custom auth script into the LiteLLM pod
volumes:
  - name: ackstorm-litellm-auth
    configMap:
      name: ackstorm-litellm-extras
      items:
        - key: auth_user_map.py
          path: auth_user_map.py
      optional: false

volumeMounts:
  - name: ackstorm-litellm-auth
    mountPath: /app/auth_user_map.py
    subPath: auth_user_map.py
    readOnly: true

# resources: deliberately unset. LiteLLM 1.83 is heavy (Python + Prisma
# + many provider SDKs); fixed limits keep tripping OOMKilled on kind.
# Test env, not capacity-constrained — let kubelet best-effort schedule.

service:
  type: ClusterIP
  port: 4000

# proxy_config is rendered verbatim into the proxy's config.yaml. The chart
# default already supplies general_settings.master_key + an example model_list;
# Helm deep-merges maps, so adding litellm_settings here keeps those defaults.
#
# SC2 / FWD-06 verification: forward client x-* headers (except x-stainless-*)
# to the LLM backend, SCOPED to the test echo model group only. This lets the
# ach-mock-model (loro) observe the forwarder-set `x-ach-environment` header so
# the SC2 e2e can assert at the backend instead of log-scraping LiteLLM. Scoped
# to demo-model so prod LLM groups never leak ACH-internal env names upstream.
proxy_config:
  litellm_settings:
    model_group_settings:
      forward_client_headers_to_llm_api:
        - demo-model
