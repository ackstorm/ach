# Top-level Postgres for ach state (operator + platform-api).
#
# Used by:  scripts/cluster.sh hydrate_postgres
# Chart:    oci://registry-1.docker.io/bitnamicharts/postgresql
#
# Bitnami pruned pinned image tags from docker.io/bitnami/* in 2025. We
# redirect to public.ecr.aws/bitnami/* (AWS-hosted Bitnami mirror) which
# still serves the chart-referenced tags. Sister alitellm-operator uses
# the same mirror. `allowInsecureImages: true` disables the chart's
# "approved containers" guard (the ECR mirror lacks the upstream
# signature chain).

chartVersion: 15.5.38

# fullnameOverride pins every chart-rendered name (primary Service,
# StatefulSet, headless Service) to `ach-postgres` so e2e tests can
# reach `svc/ach-postgres` and `sts/ach-postgres` without per-release
# name munging. Without this, the primary Service would be
# `<release-name>-postgresql` (e.g. postgres-postgresql) and every
# kubectl/DSN reference would have to chase the chart's prefix scheme.
fullnameOverride: ach-postgres

auth:
  # Non-admin app user expected by e2e tests + the ACH_DB_URL secret
  # cluster.sh writes (phase2_sc5_orphan_test.go uses ach/ach against
  # `ach` database). postgresPassword is the superuser fallback —
  # untouched in normal app flows but required by Bitnami chart schema.
  username: ach
  password: ach
  database: ach
  postgresPassword: achdev

primary:
  persistence:
    size: 1Gi

global:
  imageRegistry: public.ecr.aws
  security:
    allowInsecureImages: true
