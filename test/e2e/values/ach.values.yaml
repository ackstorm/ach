# ach itself — installed last by scripts/cluster.sh hydrate_ach against
# the in-cluster postgres / valkey / dex / litellm services hydrated
# earlier in the same `cluster.sh up` invocation.
#
# Used by:  scripts/cluster.sh hydrate_ach
# Chart:    deploy/helm/ach  (in-tree)
#
# Image coordinates:
#   The image.repo + image.tag are NOT pinned here because hydrate_ach
#   overrides them via --set (ACH_IMAGE_REPO + ACH_IMAGE_TAG env vars
#   are the canonical source — CI sets them when it builds the image
#   immediately before `cluster.sh up`).

extraEnv:
  - name: ACH_DB_URL
    valueFrom:
      secretKeyRef:
        name: ach-db-url
        key: url
  - name: ACH_CREDENTIAL_HASH_PEPPER
    valueFrom:
      secretKeyRef:
        name: ach-credential-hash-pepper
        key: pepper
  - name: ACH_BASE_URL
    value: "http://localhost:8080"
  - name: ACH_LITELLM_BASE_URL
    value: "http://litellm.litellm-system.svc.cluster.local:4000"
  - name: ACH_LITELLM_MASTER_KEY
    # Consumed by platform-api only. The forwarder no longer reads this
    # env var — its master key is sourced from LiteLLMConnection/default
    # via MasterKeySecretRef at bootstrap (B2 refactor). Migrating
    # platform-api to the same CR-driven flow is tracked separately.
    value: "sk-test-master-key"
  # ACH_DEX_ISSUER_URL MUST match the rewritten issuer that hydrate_dex
  # injects into scripts/dex-config.yaml (in-cluster URL, not the
  # localhost one Dex ships with for the docker-run UAT path).
  - name: ACH_DEX_ISSUER_URL
    value: "http://dex.dex-system.svc.cluster.local:5556/dex"
  - name: ACH_DEX_CLIENT_ID
    value: "ach-platform-api"
  - name: ACH_DEX_CLIENT_SECRET
    # Must match the `secret:` value in scripts/dex-config.yaml's
    # staticClient for the ach-platform-api OAuth client. Plaintext
    # dev value — production reads from a Secret.
    value: "dev-secret-not-for-prod"
  - name: ACH_DEX_REDIRECT_URL
    # Must match a redirectURI registered in scripts/dex-config.yaml's
    # staticClient. examples/hydrate-demo.sh drives the SSO flow over a
    # kubectl port-forward to localhost:8080, so we use the same URL
    # Dex has on file. In a real deployment this would be the public
    # platform-api callback URL behind ingress.
    value: "http://localhost:8080/platform/auth/sso/callback"
  - name: ACH_REDIS_ADDR
    value: "valkey-primary.ach-system.svc.cluster.local:6379"
  # No ACH_SSO_INSECURE_COOKIE here: the SSO cookie hardening is derived
  # from the ACH_BASE_URL scheme. ACH_BASE_URL=http://localhost:8080
  # (above) makes the platform-api emit the non-Secure `ach_sso` cookie
  # automatically, so the kind gateway's plain-http SSO round-trip works
  # without a flag. An https base would auto-harden to __Host-/Secure.

# ach-mcp-echo backend (issue #35 + BIP closed-loop). The demo Environment
# registers TWO routes against this single deployment:
#   - demo-mcp-jwt   (BIP forwardIdentityJWT=true)  → forwarder mints a JWT
#   - demo-mcp-nojwt (BIP forwardIdentityJWT=false) → forwarder sends none
# requireJwt=false lets one deployment serve both: the jwt route's token is
# validated, the nojwt route is accepted and recorded jwt_present=false.
#
# expectedIss MUST equal the forwarder's ACH_BASE_URL (the `iss` it stamps).
# On this kind cluster that is the plain http://localhost:8080 gateway host
# (NOT the chart default https://ach.local.test), so we override it here.
testMocks:
  mcpEcho:
    enabled: true
    expectedIss: "http://localhost:8080"
    expectedAud: "mcp:demo-mcp-jwt,mcp:demo-mcp-nojwt"
    requireJwt: false
