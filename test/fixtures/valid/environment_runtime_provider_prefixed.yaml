# FIXTURE: valid. Expected acceptance at admission.
# Guards that the Models element-level Pattern (S2 CRD validation) is NOT
# too strict: real LiteLLM model names are provider-prefixed ("openai/gpt-4")
# and/or tagged ("gpt-4o:latest"). Only Models uses the loose deny-pattern
# (admits "/" and ":"); MCPServers and A2AAgents use the strict pattern
# (no slash — names are chi route params). The mcpServers entry here
# ("demo-mcp-jwt") contains no slash so it also passes the strict pattern.
# See api/ach/v1alpha1/environment_types.go.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Environment
metadata:
  name: valid-runtime-provider-prefixed
  namespace: ach-system
spec:
  authorizedTeams:
    - default
  runtime:
    models:
      - "openai/gpt-4"
      - "gpt-4o:latest"
    mcpServers:
      - "demo-mcp-jwt"
    a2aAgents: []
  context:
    prompts:
      - "claude-code-system-prompt"
    plugins: []
    artifacts: []
