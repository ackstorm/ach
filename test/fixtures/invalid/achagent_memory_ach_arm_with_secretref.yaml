# FIXTURE: invalid. Expected rejection at admission.
# Rule violated: memory.achMemory.auth type=ach takes no secretRef.
# Expected error substring: "meaningless when type=ach"
#
# The ach arm reaches ach-memory THROUGH ACH: the harness sends its own ek_ as
# x-ach-key and ACH resolves the principal. There is no second credential, so a
# secretRef here would be injected into the pod and never read — the author
# almost certainly meant type=bearer.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: ACHAgent
metadata:
  name: invalid-memory-ach-arm-secret
  namespace: ach-system
spec:
  profileRef:
    name: standard
  identity:
    secretRef:
      name: ops-ek
      key: ek
  capability:
    environment: engineering-prod
  channels:
    - name: tick
      type: cron
      cron:
        schedule: "* * * * *"
  memory:
    type: ach-memory
    achMemory:
      endpoint: https://api.ackstorm.ai/mcp/ach-memory
      auth:
        type: ach
        secretRef:            # meaningless on the ach arm → CEL rejection
          name: ach-memory-key
          key: token
