# PluginMarketplace — pulls anthropic/claude-plugins-official, the
# upstream Anthropic-curated catalogue. The operator fetches
# marketplace.json, applies the include/exclude RE2 filters below, and
# upserts one `marketplace_plugins` row per surviving entry.
#
# Source type is `http` (raw.githubusercontent.com) rather than `github`
# because the GitHub-source fetcher returns the full repo as a gzipped
# tarball (Plan 02-05 plugin-publish path), and the marketplace
# controller passes that stream verbatim to the JSON parser. See
# FIX01.md §F.1 for the deeper fix; until that lands, `http` is the
# reliable path for any marketplace.json hosted on a public Git repo.
#
# Filters here pin the catalogue to only the `code-*` plugins (Claude
# Code-flavoured tooling). Drop or widen the include list to ingest the
# full catalogue.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: PluginMarketplace
metadata:
  name: anthropic-code
  namespace: ach-system
spec:
  type: http
  http:
    url: https://raw.githubusercontent.com/anthropics/claude-plugins-official/main/.claude-plugin/marketplace.json
  refresh:
    interval: 1h
    maxStaleness: 24h
  filters:
    # Anchored RE2 — matches plugin names like `code-review`, `code-edit`,
    # etc. The leading `^` is implicit (CRD docs say anchored); the
    # explicit anchor here doubles as documentation.
    include:
      - "^code-.*"
