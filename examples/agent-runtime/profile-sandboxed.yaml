# Sandboxed placement: the harness runs in the Deployment, each session's engine in an
# agent-sandbox pod. Prerequisites: agent-sandbox v1.0.x installed, chart agentSandbox.enabled=true
# (creates the shared ServiceAccount below), ach-agent >= v0.18.0-rc1.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: AgentProfile
metadata:
  name: sandboxed
spec:
  persistence:            # required: the harness PVC caches session archives
    enabled: true
    size: 5Gi
  sandbox:
    runtimeClassName: gvisor      # omit for the cluster default runtime
    warmPoolReplicas: 1
    # serviceAccountName: ach-sandboxed-agent   # default; S3 access comes from Pod Identity on this SA
    sessions:
      bucket: ach-sessions-<cluster>   # terraform output ach_sessions_bucket
  achagent:
    image: ghcr.io/ackstorm/ach-agent:v0.18.0-rc1
    placement: sandboxed
    model:
      name: demo-model
      type: openai
