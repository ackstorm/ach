apiVersion: ach.ackstorm.ai/v1alpha1
kind: AgentProfile
metadata:
  name: standard
  namespace: engineering
spec:
  image: ghcr.io/ackstorm/ach-agent:latest
  # ach.baseUrl is optional: omitted here so agents inherit the operator's own
  # ACH_BASE_URL. Set it to pin an explicit (e.g. external) ACH; an ACHAgent can
  # further override per-agent via its own spec.ach.baseUrl.
  model:
    name: openai.gpt-5
    type: openai
  engine:
    forwardEnv: [HTTPS_PROXY, SSL_CERT_FILE]
    idleTtlSeconds: 30
  limits:
    maxConcurrentInvocations: 8
    maxInvocationSeconds: 1800
    maxSteps: 50
  health:
    host: 0.0.0.0
    port: 8000
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /var/lib/ach-agent
    retainPolicy: Retain
  # Optional raw overlay strategic-merged over the operator-rendered pod template.
  # Pass-through: anything a PodTemplateSpec accepts; containers merge by name ("agent").
  podTemplate:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Sandboxed runtime: the agent container runs opencode, which has a shell tool.
      # runtimeClassName puts the whole pod behind a gVisor/Kata boundary instead of a
      # shared host kernel. Needs the RuntimeClass to exist in the cluster; an unknown
      # name leaves the pod Pending (visible as WorkloadReady=False).
      # runtimeClassName: gvisor
