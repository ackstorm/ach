# ACHAgent with the ach-memory backend (config: memory.achMemory).
#
# No extra secret is needed for the arm shown below — see `auth` for why.
#
# endpoint is the COMPLETE MCP endpoint and is rendered VERBATIM: the harness
# appends nothing, not `/mcp`, not a trailing slash. Give it the full path.
# Behind ACH's gateway that is `<ACH_BASE_URL>/mcp/<mcp-server-name>`; against
# ach-memory directly it is that service's own MCP path, e.g.
# `http://ach-memory.engineering.svc:8000/mcp/`. Do not append a path here —
# a client that appends its own is how requests end up at /mcp/mcp/.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: ACHAgent
metadata:
  name: memory-reviewer
  namespace: engineering
spec:
  profileRef: { name: standard }
  identity:
    secretRef: { name: ops-ek, key: ek }
  capability:
    environment: engineering-prod
  memory:
    type: ach-memory
    achMemory:
      endpoint: https://api.ackstorm.ai/mcp/ach-memory
      # auth has two arms, and the choice is not cosmetic:
      #
      #   type: ach     — reach ach-memory THROUGH ACH. The harness sends its own
      #                   ek_ as ACH's `x-ach-key`; ACH forwards to LiteLLM, which
      #                   resolves the principal, so the memory identity IS the
      #                   agent's ACH identity. No second credential, so no
      #                   secretRef. This is the arm production agents want.
      #                   `Authorization: Bearer` is NOT interchangeable here —
      #                   ACH's scheme is the header, and a Bearer 401s.
      #
      #   type: bearer  — talk to ach-memory DIRECTLY. Requires secretRef; the
      #                   operator injects it as ACH_SECRET_MEMORY_AUTH and renders
      #                   only the env NAME. `header` picks WHICH of ach-memory's
      #                   two identity providers the token is for, and so what the
      #                   token must BE — ach-memory mints no credentials itself:
      #                     Authorization (default) → its JWT provider; the token
      #                       must be a JWT that issuer signed. Sent as `Bearer …`.
      #                     anything else, e.g. x-litellm-api-key → its platform
      #                       provider, whose header name that deployment sets.
      #                       Sent RAW — `Bearer` belongs to Authorization, and a
      #                       resolver forwarding the value verbatim would get the
      #                       scheme word as part of the key.
      #                     auth:
      #                       type: bearer
      #                       header: x-litellm-api-key
      #                       secretRef: { name: ach-memory-key, key: token }
      #                   Pick wrong and the 401 is INVISIBLE: memory is fail-open,
      #                   so a refused credential looks like memory never working.
      #                   Whoever first WRITES to a project OWNS it — rotating to a
      #                   DIFFERENT identity orphans the bank.
      #
      # Omit `auth` entirely for an internal URL that needs no header at all.
      auth:
        type: ach
      # project is the memory-bank slug. OMIT IT (the norm): the harness derives
      # {POD_NAMESPACE}-{agent.name} at boot — here engineering-memory-reviewer.
      # Set it only to share one bank across agents. Static either way: the slug
      # SELECTS a bank, so templating ({{ }}) is rejected by the CRD and by the
      # harness. Partition per-repo via tags inside the bank, never by switching.
      # project: platform-reviews
  channels:
    - name: daily-consolidate
      type: cron
      session: { type: none }
      cron: { schedule: "0 8 * * 1-5", timezone: Europe/Madrid }
      prompt: "Review recent merges against what you remember of the architecture and conventions."
