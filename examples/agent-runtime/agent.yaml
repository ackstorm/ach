# Prereq: create the ek secret, e.g.
#   kubectl -n engineering create secret generic ops-ek --from-literal="ek=<ek_...>"
apiVersion: ach.ackstorm.ai/v1alpha1
kind: ACHAgent
metadata:
  name: gitlab-reviewer
  namespace: engineering
spec:
  profileRef: { name: standard }
  # ach.identity is required and is always the agent's own — never a shared profile
  # default (contract §5: a profile is forbidden from setting ach.identity at all).
  ach:
    identity:
      secretRef: { name: ops-ek, key: ek }
    environment: engineering-prod
    capability:
      filter:
        exclude:
          skills: [send-email]
          mcpServers: [dangerous-admin]
  # Agent env merges over profile env by name. The full agent entry wins.
  env:
    - name: GITLAB_TOKEN
      valueFrom:
        secretKeyRef: { name: gitlab-clone, key: token }
    - name: GITLAB_BASE_URL
      value: https://gitlab.example.com
  # Any spec.achagent default from the profile can be overridden per-agent (deep
  # merge: a set field wins, an omitted field inherits the profile's), e.g.:
  # image: REPLACE_WITH_PUBLISHED_CONTROL_IMAGE
  prompt:
    system: { type: text, text: "You are a senior code reviewer for the platform team." }
    compose: append
  # Reachability is opt-in (both default false → fully private). This agent
  # receives GitLab webhooks through the shared gateway, so it needs both:
  #   service — create the ClusterIP Service (achagent-gitlab-reviewer)
  #   gateway — publish /agents/{ns}/{service} + status.gatewayURL (needs service)
  # A private a2a agent would set only `service: true` (in-cluster peers reach
  # it, no public URL); omit the whole block for no Service at all.
  expose:
    service: true
    gateway: true
  channels:
    - name: gitlab-mr-review
      type: webhook
      source: gitlab
      concurrency: 4
      prompt: >-
        Review this event. The channel handoff clones a fresh checkout into
        handoff/ for every invocation; inspect and test that working tree before
        replying.
      webhook:
        auth: { type: gitlab_token, secretRef: { name: gitlab-webhook, key: secret } }
        gitlabEvents: [merge_request, note]
      handoff:
        # scope: event (default) — runs every invocation, cloning from scratch into
        # the empty $ACH_HANDOFF_DIR each time (a handoff always starts empty, so
        # there is no existing tree to fetch into). Use scope: session to run this
        # only when a new session is created instead.
        # destination (required): the relative Workspace path this handoff's output
        # replaces wholesale (contract §6).
        destination: handoff
        script: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $AUTH"
          git clone --filter=blob:none --no-recurse-submodules \
            "$GITLAB_BASE_URL/$ACH_EVENT_PROJECT_PATH.git" "$ACH_HANDOFF_DIR"
          git -C "$ACH_HANDOFF_DIR" fetch origin "refs/merge-requests/$ACH_EVENT_MR_IID/head"
          git -C "$ACH_HANDOFF_DIR" checkout --detach "$ACH_EVENT_HEAD_SHA"
        forwardEnv: [GITLAB_TOKEN, GITLAB_BASE_URL]
        timeoutSeconds: 120
    # Deterministic System Hook handler: authenticated and queued like a webhook, but
    # runs only this script. The normalized webhook JSON is on stdin; no model starts.
    - name: gitlab-register
      type: webhook-script
      source: gitlab
      concurrency: 4
      webhook:
        auth: { type: gitlab_token, secretRef: { name: gitlab-webhook, key: secret } }
        gitlabEvents:
          [project_create, project_rename, project_transfer, project_update,
           repository_update, push, merge_request]
      script:
        script: |
          payload=$(cat)
          printf 'received %s for project %s\n' "$ACH_EVENT_KIND" "$ACH_EVENT_PROJECT_ID"
        timeoutSeconds: 120
    - name: daily-security
      type: cron
      # routing is optional; omit for the adapter's default session identity (for
      # cron, one new conversation per tick — contract §2). Override independently:
      # routing: { sessionKey: "main" }  # continuity across ticks
      cron: { schedule: "0 8 * * 1-5", timezone: Europe/Madrid }
      prompt: "Scan main for new CVEs; open an issue if any are critical."
  # Agent-level workspace + session hooks, run inside the mini-harness with only
  # engine.forwardEnv variables (never channel credentials).
  hooks:
    # workspaceStart/workspaceStop need ach-runtime >= 0.1.13 (older runtimes reject them).
    workspaceStart:
      script: |
        git config --global --add safe.directory '*'
      timeoutSeconds: 60
    workspaceStop:
      script: |
        echo "workspace closing" >&2
    sessionStart:
      # exit 0 appends stdout to the prompt; exit 78 skips the run; other exits fail it.
      script: |
        echo "session starting for $ACH_AGENT_NAME" >&2
      timeoutSeconds: 30
    sessionSuspend:
      script: |
        echo "session suspending" >&2
  # Harness-managed MCP servers (rendered into the config mcpServers map).
  # Two kinds; presence = enabled. Distinct from the Environment's ACH-fronted
  # MCP set (which is hydrated, not declared here).
  mcpServers:
    # local — opencode LAUNCHES a stdio MCP subprocess (bring-your-own tool).
    # env lists var NAMES to forward; wire their values via profile/agent spec.env.
    # - name: filesystem
    #   type: local
    #   local:
    #     command: docker
    #     args: [run, -i, --rm, --mount, "type=bind,src=/data,dst=/projects/data,ro", mcp/filesystem, /projects]
    #     env: [SOME_VAR]
    # remote — opencode CONNECTS directly to a remote MCP endpoint. headers values are
    # ${env:NAME} refs (never secret values); wire the env via profile/agent spec.env.
    # SECURITY: opencode itself (running in the execution pod) can read the resolved
    # header value — front via ACH hydrate instead if that matters.
    # - name: other
    #   type: remote
    #   remote:
    #     url: https://mcp.example.com/mcp
    #     headers: { Authorization: "Bearer ${env:OTHER_MCP_TOKEN}" }
