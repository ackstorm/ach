# Prereq: create the ek secret, e.g.
#   kubectl -n engineering create secret generic ops-ek --from-literal=ek=<ek_...>
apiVersion: ach.ackstorm.ai/v1alpha1
kind: ACHAgent
metadata:
  name: gitlab-reviewer
  namespace: engineering
spec:
  profileRef: { name: standard }
  identity:
    secretRef: { name: ops-ek, key: ek }
  # Agent env merges over profile env by name. The full agent entry wins.
  env:
    - name: GITLAB_TOKEN
      valueFrom:
        secretKeyRef: { name: gitlab-clone, key: token }
    - name: GITLAB_BASE_URL
      value: https://gitlab.example.com
  capability:
    environment: engineering-prod
    filter:
      exclude:
        skills: [send-email]
        mcpServers: [dangerous-admin]
  # Any spec.achagent default from the profile can be overridden per-agent (deep
  # merge: a set field wins, an omitted field inherits the profile's), e.g.:
  # image: ghcr.io/ackstorm/ach-agent:next
  # engine:
  #   type: pi
  # cost: { source: none }
  prompt:
    system: { type: text, text: "You are a senior code reviewer for the platform team." }
    compose: append
  # Reachability is opt-in (both default false → fully private). This agent
  # receives GitLab webhooks through the shared gateway, so it needs both:
  #   service — create the ClusterIP Service (achagent-gitlab-reviewer)
  #   gateway — publish /agents/{ns}/{service} + status.gatewayURL (needs service)
  # A private a2a agent would set only `service: true` (in-cluster peers reach
  # it, no public URL); omit the whole block for no Service at all.
  expose:
    service: true
    gateway: true
  channels:
    - name: gitlab-mr-review
      type: webhook
      source: gitlab
      concurrency: 4
      prompt: >-
        Review this event. The channel prepare hook maintains a repository checkout at
        $ACH_WORKSPACE/repo; inspect and test that working tree before replying.
      webhook:
        auth: { type: gitlab_token, secretRef: { name: gitlab-webhook, key: secret } }
        gitlabEvents: [merge_request, note]
      prepare:
        script: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $AUTH"
          if [ ! -d "$ACH_WORKSPACE/repo/.git" ]; then
            git clone --filter=blob:none --no-checkout --no-recurse-submodules \
              "$GITLAB_BASE_URL/$ACH_EVENT_PROJECT_PATH.git" "$ACH_WORKSPACE/repo"
          fi
          git -C "$ACH_WORKSPACE/repo" fetch origin "refs/merge-requests/$ACH_EVENT_MR_IID/head"
          git -C "$ACH_WORKSPACE/repo" checkout --detach "$ACH_EVENT_HEAD_SHA"
        forwardEnv: [GITLAB_TOKEN, GITLAB_BASE_URL]
        timeoutSeconds: 120
      cleanup:
        script: |
          set -eu
          test -n "$ACH_WORKSPACE"
          rm -rf -- "$ACH_WORKSPACE"
        timeoutSeconds: 30
    - name: daily-security
      type: cron
      # session is a block since v0.6.3 (was a bare string `session: none`).
      # type: auto|none|custom; key required iff type=custom; +maxTokens/overflow.
      session:
        type: none
      cron: { schedule: "0 8 * * 1-5", timezone: Europe/Madrid }
      prompt: "Scan main for new CVEs; open an issue if any are critical."
  # Harness-managed MCP servers (rendered into the config mcpServers map).
  # Three kinds; presence = enabled. Distinct from the Environment's ACH-fronted
  # MCP set (which is hydrated, not declared here).
  mcpServers:
    # repoCheckout — the harness HOSTS a checkout_repo(project, ref, subpath?) tool
    # (gitlab archive → on-disk tree; full-tree rg / run tests / build). It reads the
    # archive from the hydrated MCP server named by sourceMcpServerId, which MUST be
    # one the Environment (engineering-prod) exposes; a wrong id fails soft at runtime.
    - name: repo-checkout
      type: repoCheckout
      repoCheckout:
        sourceMcpServerId: gitlab-ro   # must exist in the Environment's MCP set
        # tmpBase: /tmp/gitlab         # optional (harness default)
        # ttlSeconds: 3600             # optional (harness default)
    # local — opencode LAUNCHES a stdio MCP subprocess (bring-your-own tool).
    # env lists var NAMES to forward; wire their values via profile/agent spec.env.
    # - name: filesystem
    #   type: local
    #   local:
    #     command: docker
    #     args: [run, -i, --rm, --mount, "type=bind,src=/data,dst=/projects/data,ro", mcp/filesystem, /projects]
    #     env: [SOME_VAR]
    # remote — opencode CONNECTS directly to a remote MCP endpoint. headers values are
    # ${env:NAME} refs (never secret values); wire the env via profile/agent spec.env.
    # SECURITY: the co-resident agent can read the resolved header — front via ACH
    # hydrate instead if that matters.
    # - name: other
    #   type: remote
    #   remote:
    #     url: https://mcp.example.com/mcp
    #     headers: { Authorization: "Bearer ${env:OTHER_MCP_TOKEN}" }
