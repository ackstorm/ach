apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-echo
  namespace: mcp
spec:
  image: ealen/echo-server:latest
  env:
  - name: PORT
    value: "8080"
  transport: stdio
  proxyMode: streamable-http
  podTemplateSpec:
    spec:
      containers:
      - name: mcp
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: false
