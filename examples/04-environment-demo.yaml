# Environment — the projection unit a user hydrates against.
#
# References the real CRs shipped in this folder:
#   - Plugin/caveman              (06-plugin-caveman.yaml)
#   - Prompt/claude-code-system-prompt (07-prompt-claudecode-leak.yaml)
#   - Artifact/openclaw-templates (08-artifact-openclaw-templates.yaml)
#
# plus the "default" LiteLLM Team (auto-created on first cluster-up by
# scripts/cluster.sh hydrate_litellm + scripts/cluster.sh
# hydrate_fixtures + the SSO provisionUser flow).
#
# runtime.* is intentionally empty: this demo does not register any
# Models / MCPServers / A2AAgents in LiteLLM. The /platform/hydrate
# response still emits the runtime block with three empty arrays per
# the Hub §15.1 "both blocks always present" invariant.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Environment
metadata:
  name: demo
  namespace: ach-system
spec:
  authorizedTeams:
    - default
  runtime:
    models: []
    mcpServers: []
    a2aAgents: []
  context:
    prompts:
      - claude-code-system-prompt
    plugins:
      - caveman
    artifacts:
      - openclaw-templates
