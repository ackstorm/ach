# Prompt — pulls a single Markdown file from a public GitHub repo and
# serves it via the Content Service. Demonstrates the simplest
# external-reference path (no plugin tarball, no authSecretRef).
#
# Source repo + file are intentionally tiny + public so the example
# works out of the box with no GitHub PAT. Refresh poll is 1h with a
# 24h staleness ceiling — typical small-content cadence.
apiVersion: ach.ackstorm.ai/v1alpha1
kind: Prompt
metadata:
  name: demo-prompt
  namespace: ach-system
spec:
  type: github
  contentType: text/markdown
  refresh:
    interval: 1h
    maxStaleness: 24h
  github:
    repo: ackstorm/ach
    ref: main
    path: README.md
