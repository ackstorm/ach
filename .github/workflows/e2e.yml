name: e2e

# Not a required check: this measures whether e2e fits a hosted runner. Paths
# are the surfaces AGENTS.md requires e2e for.
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/controller/**'
      - 'internal/platformapi/**'
      - 'internal/forwarder/**'
      - 'internal/contentservice/**'
      - 'api/v1alpha1/**'
      - 'deploy/helm/ach/**'
      - 'db/migrations/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run e2e
        run: make e2e-full
