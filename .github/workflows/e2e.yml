name: e2e

# Not a required check: this measures whether e2e fits a hosted runner. Paths
# are the surfaces AGENTS.md requires e2e for, plus the CLI the suite drives.
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/controller/**'
      - 'internal/platformapi/**'
      - 'internal/forwarder/**'
      - 'internal/contentservice/**'
      - 'internal/cli/**'
      - 'cmd/ach-cli/**'
      - 'api/ach/v1alpha1/**'
      - 'deploy/helm/ach/**'
      - 'db/migrations/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: E2E changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    needs: changes
    # A release PR matches deploy/helm/ach/** with version lines only; the
    # commit it sits on ran e2e on its own PR.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # `kind load` fails on a multi-arch image from Docker's containerd image
      # store: "ctr: content digest ...: not found".
      - name: Use Docker's classic image store
        run: |
          docker info --format '{{.Driver}}'
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } |
            jq '.features["containerd-snapshotter"] = false' |
            sudo tee /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Driver}}'

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run e2e
        run: make e2e-full
