name: e2e

# Not a required check: this measures whether e2e fits a hosted runner. Paths
# are the surfaces AGENTS.md requires e2e for.
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/controller/**'
      - 'internal/platformapi/**'
      - 'internal/forwarder/**'
      - 'internal/contentservice/**'
      - 'api/v1alpha1/**'
      - 'deploy/helm/ach/**'
      - 'db/migrations/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # `kind load` fails on a multi-arch image from Docker's containerd image
      # store: "ctr: content digest ...: not found".
      - name: Use Docker's classic image store
        run: |
          docker info --format '{{.Driver}}'
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } |
            jq '.features["containerd-snapshotter"] = false' |
            sudo tee /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.Driver}}'

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run e2e
        run: make e2e-full
