name: devtools-image

# Builds and pushes the pre-baked devtools image consumed by ci.yml jobs.
# Image is content-addressed by sha256(Dockerfile.devtools) — same hash
# computed by .github/actions/setup-devtools. Subsequent CI jobs pull the
# tagged image instead of rebuilding from scratch (~30s warm / 2-3min cold
# saved per job, × 5 jobs per PR).
#
# Triggers:
#   - push:main when Dockerfile.devtools or this workflow changes
#   - pull_request when those paths change (builds + pushes so the PR's
#     CI run can consume the new image)
#   - workflow_dispatch for manual rebuilds (first push to seed `:latest`,
#     forced rebuild via UI, etc.)
#   - schedule (weekly) as a SELF-HEALING BACKSTOP — see below.
#
# Why the cron exists: the path triggers fire exactly once per Dockerfile
# change, and nothing retries. On 2026-08-26 the Go 1.26.6 bump changed the
# Dockerfile (hash -> e55bfa0ac4f2) and its run ended in `startup_failure`
# after 9s. No image was ever pushed for that hash, and because the Dockerfile
# did not change again, the workflow never ran again either. Every CI and
# release job since cold-built the image instead — a silent ~25 min tax per
# release, visible only as a `::warning::` annotation nobody was looking for.
# The weekly run reconciles whatever is on main with what is in GHCR, so a
# cancelled run, a startup_failure, or a GHCR outage self-heals within a week
# instead of never. It skips the build when the image is already present, so
# the steady-state cost is one manifest lookup.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.devtools'
      - '.github/workflows/devtools-image.yml'
      - '.github/actions/setup-devtools/**'
  pull_request:
    paths:
      - 'Dockerfile.devtools'
      - '.github/workflows/devtools-image.yml'
      - '.github/actions/setup-devtools/**'
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC, mirroring govulncheck.yml's cadence
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devtools-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build + push devtools image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Compute image reference
        id: ref
        run: |
          HASH=$(sha256sum Dockerfile.devtools | cut -c1-12)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/ach-devtools:$HASH" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$OWNER/ach-devtools:latest" >> "$GITHUB_OUTPUT"
          echo "buildcache=ghcr.io/$OWNER/ach-devtools:buildcache" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reconciliation guard for the scheduled run: if GHCR already holds this
      # hash there is nothing to heal, so skip the build. A dispatch or a
      # Dockerfile change always rebuilds (an operator asking for a rebuild, or
      # a genuinely new hash, must not be short-circuited).
      - name: Check whether this hash is already published
        id: exists
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::devtools image ${{ steps.ref.outputs.hash }} already published — nothing to reconcile"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push devtools image
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.devtools
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ github.ref == 'refs/heads/main' && steps.ref.outputs.latest || '' }}
          cache-from: type=registry,ref=${{ steps.ref.outputs.buildcache }}
          cache-to: type=registry,ref=${{ steps.ref.outputs.buildcache }},mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Devtools image"
            echo ""
            echo "- Hash: \`${{ steps.ref.outputs.hash }}\`"
            if [ "${{ steps.exists.outputs.skip }}" = "true" ]; then
              echo "- Already published (scheduled reconcile, no rebuild)"
            else
              echo "- Pushed: \`${{ steps.ref.outputs.image }}\`"
            fi
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "- Also tagged: \`${{ steps.ref.outputs.latest }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
