name: ci

# Tiered gating policy + rationale: references/docs/workflow.md.
# PR-only: every commit on main arrives through a PR, enforced by branch
# protection with ci-ok as the required check. Each test job mirrors a local
# `make` target. E2e is a separate non-required workflow.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run linter
        run: make qa-lint

      - name: Edition isolation gate
        run: make qa-edition

      # Issue #44: fail if the chart's copied CRDs (crd-sources/) drift from
      # config/crd/bases. helm-sync-check re-syncs then gates on ANY change —
      # added, deleted or modified; a stale chart CRD would ship an old schema to
      # `helm install/upgrade` users.
      - name: Chart CRD drift gate
        run: make helm-sync-check

      - name: Generated code drift gate
        run: |
          ./scripts/dev.sh make gen-code gen-manifests
          git diff --exit-code

      - name: Release script self-check
        run: make test-scripts

      - name: Helm topology render check
        run: make helm-render-check

      - name: Grafana dashboard metric-name check
        run: make qa-dashboards

  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run unit tests
        run: make test-unit

      - name: Run console unit tests
        run: make test-ui

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-unit
          path: cover-unit.out
          if-no-files-found: warn

  envtest:
    name: Envtest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run controller + toolhive envtest
        run: make test-envtest-fast

      - name: Upload envtest coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-envtest
          path: cover-envtest.out
          if-no-files-found: warn

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      # NOTE: actions/dependency-review-action is intentionally NOT used here.
      # It requires GitHub Advanced Security + Dependency Graph, neither of
      # which is enabled on this repo (private, no GHAS plan) — the step
      # hard-fails ("Advanced Security must be enabled") and, having no
      # `if: always()` successor, SKIPS the real security gate below. It was
      # dropped deliberately in 8554dc8 (govulncheck is the canonical
      # supply-chain gate) then re-introduced by the alitellm alignment in
      # 6afb915; this re-drops it. Re-add only once GHAS is enabled.

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run security gate
        run: make qa-security

      # gosec SARIF emitted out-of-band for the Security tab; `make
      # security` already gated HIGH findings, so SARIF upload is
      # visibility-only and tolerates failure.
      - name: Generate gosec SARIF
        if: always()
        run: |
          ./scripts/dev.sh bash -c 'go run github.com/securego/gosec/v2/cmd/gosec@v2.22.7 -no-fail -fmt=sarif -out=gosec-results.sarif -exclude-dir=vendor -exclude-dir=.gocache ./...'

      - name: Upload gosec SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, envtest, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a CI job ended as $result"; exit 1 ;;
            esac
          done
