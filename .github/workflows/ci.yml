name: ci

# Tiered gating policy + rationale: references/docs/workflow.md.
# PR-only: the pull_request event is the single CI trigger (aligned with
# sister project alitellm-operator). Each test job mirrors a local `make`
# target via ./scripts/dev.sh.
#
# NOTE: PR-only is only a safe gate if branch protection on `main` is
# enabled — otherwise a direct push to main bypasses CI entirely. Enable
# branch protection (requires a paid plan on a private repo, or making the
# repo public) before relying on this. Until then, direct pushes to main
# are unguarded.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.planning/**'
      - 'references/**'
      - 'FIX*.txt'
      - 'LICENSE'
      - 'NOTICE'
      - 'CODEOWNERS'
      - '.gitignore'

# main is PR-only. Post-merge content equals PR head content, so re-running
# on push main is redundant. Release commits are handled by release.yml.
# Soak/leak/fuzz-long/e2e run in NO workflow — nightly.yml was deleted
# 2026-07-17 (unused). They are local-only `make` targets now.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run linter
        run: make qa-lint

      # Issue #44: fail if the chart's copied CRDs (crd-sources/) drift from
      # config/crd/bases. helm-sync-check re-syncs then gates on ANY change —
      # added, deleted or modified; a stale chart CRD would ship an old schema to
      # `helm install/upgrade` users.
      - name: Chart CRD drift gate
        run: make helm-sync-check

      - name: Helm topology render check
        run: make helm-render-check

      - name: Grafana dashboard metric-name check
        run: make qa-dashboards

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run unit tests
        run: make test-unit

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-unit
          path: cover-unit.out
          if-no-files-found: warn

  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run controller + toolhive envtest
        run: make test-envtest-fast

      - name: Upload envtest coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-envtest
          path: cover-envtest.out
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      # NOTE: actions/dependency-review-action is intentionally NOT used here.
      # It requires GitHub Advanced Security + Dependency Graph, neither of
      # which is enabled on this repo (private, no GHAS plan) — the step
      # hard-fails ("Advanced Security must be enabled") and, having no
      # `if: always()` successor, SKIPS the real security gate below. It was
      # dropped deliberately in 8554dc8 (govulncheck is the canonical
      # supply-chain gate) then re-introduced by the alitellm alignment in
      # 6afb915; this re-drops it. Re-add only once GHAS is enabled.

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run security gate
        run: make qa-security

      # gosec SARIF emitted out-of-band for the Security tab; `make
      # security` already gated HIGH findings, so SARIF upload is
      # visibility-only and tolerates failure.
      - name: Generate gosec SARIF
        if: always()
        run: |
          ./scripts/dev.sh bash -c 'go run github.com/securego/gosec/v2/cmd/gosec@v2.22.7 -no-fail -fmt=sarif -out=gosec-results.sarif -exclude-dir=vendor -exclude-dir=.gocache ./...'

      - name: Upload gosec SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: gosec-results.sarif
          category: gosec
