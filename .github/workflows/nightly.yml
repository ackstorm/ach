name: nightly

# Long-running soak + leak + fuzz harnesses + full e2e on a 04:00 UTC cadence
# (and on demand via workflow_dispatch). Split into parallel jobs so total
# wall-clock is ~max(jobs) instead of sum. Never cancel an in-flight run.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  long-soak:
    name: 35-min AC-R1 cross-kind soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - uses: actions/setup-go@v6  # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Go build + module cache
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run 35-min AC-R1 cross-kind soak
        run: make test-smoke-idempotency-long

  leak-soak:
    name: 1000-reconcile FD+goroutine leak harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - uses: actions/setup-go@v6  # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Go build + module cache
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run 1000-reconcile leak harness
        run: make test-leak-soak

  fuzz-long:
    name: Go fuzz (10min per target)
    runs-on: ubuntu-latest
    # 2 targets x 10 min = ~20 min sequential; 45 minutes adds margin for the
    # devtools image cold-build path.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run 10-min fuzz on FuzzSubstitute + FuzzNormalize
        run: make qa-fuzz-long

      # On a crash, the fuzzer writes new corpus files under
      # internal/<pkg>/testdata/fuzz/<TargetName>/ for triage.
      # `if-no-files-found: ignore` keeps non-failure runs noise-free.
      - name: Upload fuzz crash corpus
        if: failure()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: |
            internal/substitution/testdata/fuzz/FuzzSubstitute/**
            internal/normalize/testdata/fuzz/FuzzNormalize/**
          if-no-files-found: ignore

  e2e:
    # E2E was removed from PR CI (#110) — this nightly run is the scheduled
    # backstop so a regression on main surfaces within 24h instead of at the
    # next local `make e2e-full`. Job shape ports the removed ci.yml job
    # (minus the forensics script, deleted since).
    name: E2E (kind + helm)
    runs-on: ubuntu-latest
    # 40m budget — ach hydrates postgres + redis + dex + litellm + toolhive
    # before the suite runs.
    timeout-minutes: 40
    steps:
      # GitHub-hosted ubuntu runners ship ~14 GB free on /. The e2e job pulls
      # the devtools image + kind node image AND runs `make build-image` whose
      # builder stage does `go mod download` (large k8s.io/* tree) into the
      # buildx cache — together they overflow the disk. Reclaim the
      # preinstalled toolchains we never use (~25-30 GB) before anything pulls.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      # `make e2e-full` wraps cluster-up + e2e-run + teardown in one bash with
      # a trap; GH Actions cannot share a trap across steps, so the same
      # semantics are three steps (cluster-down under `if: always()`).
      - name: Cluster up + hydrate
        run: make cluster-up

      - name: Run E2E suite
        run: make e2e-run

      # logs-operator follows (-f) — unusable in CI; dump a bounded tail instead.
      - name: Dump pod state + operator logs on failure
        if: failure()
        run: |
          ./scripts/dev.sh kubectl get pods -A -o wide || true
          ./scripts/dev.sh kubectl -n ach-system logs --tail=500 --timestamps deploy/ach-operator --all-containers || true

      - name: Cluster down (trap equivalent — always runs)
        if: always()
        run: make cluster-down
